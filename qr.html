<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13233A">
<title>Kiểm QR nhãn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F1; --card:#FFFFFF; --ink:#13233A; --ink2:#51606E; --rule:#CDD5D7;
  --pass:#0E7A43; --fail:#C0182A; --warn:#9A5F00; --none:#56626B; --focus:#2F6FEB;
  --r:10px; --pad:16px;
  --sans:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:0 12px 40px}

/* top bar: who and where */
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px}
.top .row{max-width:540px;margin:0 auto;display:flex;gap:8px;align-items:center}
.top h1{font-size:17px;font-weight:700;margin:0 auto 0 0;letter-spacing:.01em}
.top select,.top input{background:#22354F;border:1px solid #3A4E69;color:#fff;border-radius:8px;padding:6px 8px;min-height:36px}
.top input{width:118px}
.top select{width:84px}

.banner{margin:12px 0 0;padding:10px 12px;border-radius:var(--r);font-size:14px}
.banner.err{background:#FBE7E9;color:#7D0F1B}
.banner.info{background:#E3ECF7;color:#1C3A63}

/* steps: a real sequence, so numbered */
.step{background:var(--card);border-radius:var(--r);margin-top:12px;padding:var(--pad);border:1px solid var(--rule)}
.step[aria-disabled="true"]{opacity:.45;pointer-events:none}
.step h2{display:flex;gap:10px;align-items:baseline;font-size:16px;font-weight:600;margin:0 0 10px}
.step h2 .n{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;
  font-size:13px;font-weight:700;transform:translateY(3px)}
.step.done h2 .n{background:var(--ink);color:#fff}
.hint{color:var(--ink2);font-size:14px;margin:4px 0 0}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:17px;background:#fff}
#barInput{font-family:var(--mono);letter-spacing:.04em}
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:600;min-height:48px;cursor:pointer}
.btn.pri{background:var(--ink);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.wide{width:100%}
.link{background:none;border:0;padding:6px 0;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:14px}
.hits{margin-top:8px;border:1px solid var(--rule);border-radius:8px;max-height:340px;overflow:auto;background:#fff}
.hits:empty{display:none}
.hit{padding:10px 12px;border-bottom:1px solid #EEF1F1;cursor:pointer}
.hit:last-child{border-bottom:0}
.hit:active,.hit:focus-visible{background:#EAF0F7}
.hit .c{font-family:var(--mono);font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.hit .tag{font-family:var(--sans);font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:#E3E9EE;color:var(--ink2)}
.hit .tag.cho{background:#FBF0DC;color:var(--warn)}
.hit .n{font-size:13px;color:var(--ink2);margin-top:2px}
.modebar{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);margin-top:12px;padding:10px var(--pad);display:grid;gap:8px}
.modebar .mrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modebar .ml{font-size:13px;color:var(--ink2);min-width:74px}
.modebar .seg{margin-left:0}
.modebar .seg button:disabled{opacity:.4}
.scope{margin-top:4px;font-size:14px;font-weight:600;opacity:.95}
.notes{margin-top:10px;background:rgba(255,255,255,.16);border-radius:8px;padding:8px 10px;font-size:14px}
.notes p{margin:0}.notes p+p{margin-top:6px}
.prop h2{font-size:16px;font-weight:600;margin:12px 0 4px}
.listhead{font-size:12px;color:var(--ink2);padding:8px 12px 4px}
.empty{font-size:13px;color:var(--ink2);padding:10px 12px}
.prod{margin-top:10px;font-size:15px}
.prod b{font-weight:600}
.prod .meta{color:var(--ink2);font-size:13px;margin-top:2px}
.msg{margin-top:10px;font-size:14px;padding:8px 10px;border-left:4px solid var(--none);background:#F2F4F5}
.msg.bad{border-color:var(--fail);background:#FBEDEE}
.msg.warn{border-color:var(--warn);background:#FBF3E4}
.read{margin-top:10px;font-family:var(--mono);font-size:13px;word-break:break-all;color:var(--ink2)}
.read b{color:var(--ink);font-weight:600}

/* verdict: the one loud element */
.verdict{margin-top:12px;border-radius:var(--r);color:#fff;padding:18px var(--pad) 16px;background:var(--none)}
.verdict.pass{background:var(--pass)} .verdict.fail{background:var(--fail)} .verdict.warn{background:var(--warn)}
.verdict .kl{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:.01em}
.verdict .why{margin-top:6px;font-size:15px}
.digits{margin-top:14px;background:rgba(255,255,255,.96);color:var(--ink);border-radius:8px;padding:10px 10px 8px;overflow-x:auto}
.drow{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:6px;margin:3px 0}
.drow .lab{font-size:12px;color:var(--ink2)}
.cells{display:flex;gap:1px}
.cells span{font-family:var(--mono);font-weight:600;font-size:15px;width:1.08em;text-align:center;border-bottom:2px solid var(--rule);padding:1px 0}
.cells span.x{background:var(--fail);color:#fff;border-color:var(--fail)}
.cells.empty{font-size:13px;color:var(--ink2)}
.logst{margin-top:10px;font-size:13px;opacity:.95}
.after{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* ledger */
.ledger{margin-top:18px}
.ledger h2{font-size:15px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.seg{margin-left:auto;display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 10px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--rule);
  border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--none)}
.dot.pass{background:var(--pass)} .dot.fail{background:var(--fail)} .dot.warn{background:var(--warn)}
.lrow .t{color:var(--ink2);font-size:12px}
.lrow .who{font-size:12px;color:var(--ink2);text-align:right}
.foot{margin-top:18px;font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;align-items:center}

/* camera sheet */
.cam{position:fixed;inset:0;z-index:20;background:#0A1420;color:#fff;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.cam.open{display:flex}
.cam .ttl{font-size:17px;font-weight:600}
.cam .sub{font-size:14px;opacity:.8;margin-top:2px}
#reader{flex:1;margin:12px 0;border-radius:10px;overflow:hidden;background:#000;min-height:260px}
#reader video{object-fit:cover}
.cam .btn{background:#fff;color:var(--ink)}
.hidden{display:none !important}
@media (prefers-reduced-motion: no-preference){ .verdict{animation:pop .18s ease-out} @keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <h1>Kiểm QR nhãn</h1>
    <select id="site" aria-label="Site">
      <option value="">Site</option><option>MBP</option><option>MGP</option><option>MIP</option><option>MHP</option>
    </select>
    <input id="nguoi" placeholder="Tên người kiểm" aria-label="Tên người kiểm" autocomplete="name">
  </div>
</header>

<main class="wrap">
  <div id="banner" class="banner hidden" role="status"></div>

  <section class="modebar" aria-label="Phạm vi kiểm">
    <div class="mrow"><span class="ml">Đối chiếu</span>
      <span class="seg" role="group" aria-label="Đối chiếu theo">
        <button type="button" data-ref="PKG" aria-pressed="true">Mã PKG</button>
        <button type="button" data-ref="TP" aria-pressed="false">Mã TP</button>
        <button type="button" data-ref="NONE" aria-pressed="false">Không</button>
      </span></div>
    <div class="mrow"><span class="ml">Quét QR</span>
      <span class="seg" role="group" aria-label="Có quét QR">
        <button type="button" data-qr="1" aria-pressed="true">Có</button>
        <button type="button" data-qr="0" aria-pressed="false">Không</button>
      </span>
      <span class="hint" id="modeLbl"></span></div>
  </section>

  <section class="step" id="s1">
    <h2><span class="n">1</span><span id="s1t">Mã PKG theo phiếu nhập</span></h2>
    <div class="field">
      <input id="pkg" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Gõ mã PKG, mã TP, tên hoặc barcode" aria-label="Tìm mã PKG" aria-controls="hits">
      <button class="btn pri" id="pkgOk" type="button">Chọn</button>
    </div>
    <div id="hits" class="hits" role="listbox" aria-label="Kết quả tìm"></div>
    <div id="pkgInfo"></div>
  </section>

  <section class="step" id="s2" aria-disabled="true">
    <h2><span class="n" id="n2">2</span>Quét QR trên nhãn</h2>
    <button class="btn pri wide" id="scanQr" type="button">Mở camera quét QR</button>
    <div id="qrInfo"></div>
  </section>

  <section class="step" id="s3" aria-disabled="true">
    <h2><span class="n" id="n3">3</span><span id="s3t">Quét barcode trên nhãn</span></h2>
    <button class="btn pri wide" id="scanBar" type="button">Mở camera quét barcode</button>
    <button class="link" id="typeBarBtn" type="button">Không quét được? Gõ số barcode</button>
    <div class="field hidden" id="typeBar">
      <input id="barInput" inputmode="numeric" pattern="[0-9]*" maxlength="14" placeholder="13 hoặc 14 số" aria-label="Số barcode">
      <button class="btn sec" id="barOk" type="button">Dùng số này</button>
    </div>
    <div id="barInfo"></div>
  </section>

  <section id="result" class="hidden" aria-live="polite"></section>

  <section class="ledger">
    <h2>Sổ kiểm
      <span class="seg" role="group" aria-label="Phạm vi sổ">
        <button type="button" id="soMay" aria-pressed="true">Máy này</button>
        <button type="button" id="soSite" aria-pressed="false">Cả site</button>
      </span>
    </h2>
    <div id="soList"></div>
  </section>

  <div class="foot">
    <span id="masterSt">Chưa có master</span>
    <button class="link" id="reloadMaster" type="button">Cập nhật master</button>
  </div>
  <div class="foot"><span id="ver"></span><span id="queueSt"></span></div>
</main>

<div class="cam" id="cam" role="dialog" aria-modal="true" aria-labelledby="camTtl">
  <div class="ttl" id="camTtl">Quét</div>
  <div class="sub" id="camSub"></div>
  <div id="reader"></div>
  <button class="btn wide" id="camClose" type="button">Huỷ</button>
</div>

<script src="html5-qrcode.min.js" onerror="(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';document.head.appendChild(s);})()"></script>
<script>
'use strict';
/* ====== config ====== */
const BAN_DUNG = 'q4';
// Same deployment URL as index.html (date code app). Copy it here.
const TRAM_URL = 'https://script.google.com/macros/s/AKfycbzFOhrxosY7-5yivMmhF9GtzsMMAFYdp0KfUKMucCJmktBqGm_udam2jm2hQH9zkf_X/exec';
const tramUrl = () => window.__TRAM_URL__ || TRAM_URL;
const QR_RE = /^https:\/\/i\.tcx\.com\.vn\/(\d{13})([0-9a-f]{11})$/i;
const NEED_SAME_READS = 2;
const K = { site:'qr_site', nguoi:'qr_nguoi', master:'qr_master_cache', queue:'qr_queue', hist:'qr_history', recent:'qr_recent', recentTp:'qr_recent_tp', mode:'qr_mode' };

/* ====== pure logic (tested) ====== */
function gtinValid(s){
  if(!/^(\d{8}|\d{12,14})$/.test(s || '')) return false;
  const d=[...s].map(Number), c=d.pop();
  const t=d.reverse().reduce((a,x,i)=>a + x*(i%2 ? 1 : 3), 0);
  return (10 - t%10)%10 === c;
}
const pad14 = s => String(s||'').padStart(14,'0');

function parseQR(raw){
  const t = String(raw||'').trim();
  const g = (t.match(/i\.tcx\.com\.vn\/(\d{13})/i) || [])[1] || '';
  const m = t.match(QR_RE);
  if(!m){
    if(!/^https:\/\/i\.tcx\.com\.vn\//i.test(t)) return {ok:false, raw:t, gtin:g, why:'QR không trỏ về https://i.tcx.com.vn/'};
    return {ok:false, raw:t, gtin:g, why:'QR sai định dạng (cần 13 số barcode và 11 ký tự sê-ri)'};
  }
  if(!gtinValid(m[1])) return {ok:false, raw:t, gtin:m[1], why:'13 số trong QR sai số kiểm tra'};
  return {ok:true, raw:t, gtin:m[1], serial:m[2].toLowerCase()};
}

// rows: [{ma_pkg,cap,gtin,site,trang_thai,ly_do,nguon,...}] ; BO_SUNG rows override XUAT rows for the same (pkg, site)
// rows: [{ma_pkg,cap,gtin,site,trang_thai,ly_do,nguon,...}]
// BO_SUNG rows that are DA_DUYET override XUAT rows for the same (pkg, site).
// BO_SUNG rows still CHO_DUYET (app proposals) never count as master.
function resolveMaster(rows, pkg, site){
  const all = rows.filter(r => r.ma_pkg === pkg);
  if(!all.length) return {st:'KHONG_CO', msg:'Mã PKG này chưa có trong master.', pending:false};
  const here = all.filter(r => r.site === site);
  if(!here.length){
    const other = [...new Set(all.map(r => r.site || 'không rõ site'))].join(', ');
    return {st:'KHAC_SITE', msg:`Mã này chỉ có master ở ${other}, chưa có cho ${site}.`, row:all[0], pending:false};
  }
  const pending = here.some(r => r.nguon === 'BO_SUNG' && r.trang_thai !== 'DA_DUYET');
  const bsOk = here.filter(r => r.nguon === 'BO_SUNG' && r.trang_thai === 'DA_DUYET');
  const pool = bsOk.length ? bsOk : here.filter(r => r.nguon !== 'BO_SUNG');
  if(!pool.length) return {st:'DE_XUAT', msg:'Mã này đã có đề xuất, đang chờ duyệt.', row:here[0], pending:true};
  const ok = pool.filter(r => r.trang_thai === 'DA_DUYET' && gtinValid(r.gtin));
  const keys = [...new Set(ok.map(r => r.cap + '|' + pad14(r.gtin)))];
  const tail = pending ? ' Đã có đề xuất chờ duyệt.' : '';
  if(!keys.length) return {st:'CHO_DUYET', msg:'Master của mã này đang chờ duyệt' + (pool[0].ly_do ? ': ' + pool[0].ly_do : '.') + tail, row:pool[0], pending};
  if(keys.length > 1) return {st:'XUNG_DOT', msg:'Master có hơn một barcode cho mã này tại ' + site + '.' + tail, row:ok[0], pending};
  return {st:'OK', row:ok[0]};
}
// PKG level: from master when known, else from the code prefix (BGT* = carton)
const capFor = (m, pkg) => (m && m.st === 'OK' && m.row.cap !== 'TP') ? m.row.cap : (/^BGT/.test(pkg || '') ? 'THUNG' : 'DON_VI');

/* FG level: every barcode registered for the FG at this site counts, including the
   ones whose PKG code is in conflict (XUNG_DOT): the barcode is still registered
   for that FG, only its PKG code is unclear. App proposals (BO_SUNG not approved) never count. */
function fgPool(rows, site){
  return rows.filter(r => r.site === site && r.item_tp && gtinValid(r.gtin) &&
    (r.nguon === 'BO_SUNG' ? r.trang_thai === 'DA_DUYET' : (r.trang_thai === 'DA_DUYET' || r.trang_thai === 'XUNG_DOT')));
}
function resolveFG(rows, tp, site){
  const any = rows.filter(r => r.item_tp === tp);
  if(!any.length) return {st:'KHONG_CO', msg:'Mã thành phẩm này chưa có trong master barcode.'};
  const here = any.filter(r => r.site === site);
  if(!here.length) return {st:'KHAC_SITE', msg:`Thành phẩm này chỉ có barcode đăng ký ở ${[...new Set(any.map(r => r.site || 'không rõ'))].join(', ')}, chưa có cho ${site}.`, row:{item_tp:tp, ten_sp:any[0].ten_sp, cap:'TP'}};
  const pool = fgPool(here, site);
  if(!pool.length) return {st:'CHO_DUYET', msg:`Thành phẩm này chưa có barcode đăng ký hợp lệ ở ${site}.`, row:{item_tp:tp, ten_sp:here[0].ten_sp, cap:'TP'}};
  const by = new Map();
  pool.forEach(r => { const k = pad14(r.gtin); if(!by.has(k)) by.set(k, {gtin:r.gtin, cap:r.cap, ngay:r.ngay_dang_ky || '', pkgs:[]}); by.get(k).pkgs.push(r.ma_pkg); });
  return {st:'OK', row:{item_tp:tp, ten_sp:pool[0].ten_sp, cap:'TP'}, gtins:[...by.values()]};
}
// FGs at this site that have this barcode registered: [{item_tp, ten_sp}]
function ownersOf(rows, site, gtin){
  const seen = new Map();
  fgPool(rows, site).filter(r => pad14(r.gtin) === pad14(gtin)).forEach(r => { if(!seen.has(r.item_tp)) seen.set(r.item_tp, {item_tp:r.item_tp, ten_sp:r.ten_sp}); });
  return [...seen.values()];
}
const fgName = o => `${o.item_tp} ${o.ten_sp}`;
const MODE_LBL = { 'PKG|1':'PKG–QR–barcode', 'PKG|0':'PKG–barcode', 'TP|1':'TP–QR–barcode', 'TP|0':'TP–barcode', 'NONE|1':'QR–barcode' };
const modeKey = md => md.ref + '|' + (md.qr ? 1 : 0);

// ctx: {mode:{ref,qr}, m, qr, bar:{val}, seen:Map(serial -> {at, pkg}), cap, owners:[{item_tp,ten_sp}]}
// QR vs barcode is judged first and needs no master. In PKG and TP modes a missing
// master gives CẦN XÁC NHẬN, never ĐẠT (L1). In NONE mode the user chose to check
// QR–barcode only, so ĐẠT is allowed and always carries that scope.
function verdict(ctx){
  const {m, qr, bar, seen} = ctx;
  const mode = ctx.mode || {ref:'PKG', qr:true};
  const cap = ctx.cap || capFor(m, '');
  const useQr = mode.ref === 'NONE' || (mode.qr && !(mode.ref === 'PKG' && cap === 'THUNG'));
  const owners = ctx.owners || [];
  const notes = [];
  if(!bar || !gtinValid(bar.val)) return {kl:'CẦN XÁC NHẬN', why:'Số barcode không hợp lệ. Quét lại.', code:'BAR', notes};
  if(useQr){
    if(!qr) return {kl:'CẦN XÁC NHẬN', why:'Chưa quét QR.', code:'NO_QR', notes};
    if(!qr.ok) return {kl:'KHÔNG ĐẠT', why:qr.why + '.', code:'QR_BAD', notes};
    if(pad14(qr.gtin) !== pad14(bar.val)) return {kl:'KHÔNG ĐẠT', why:'Mã trong QR khác barcode in trên nhãn.', code:'QR_NE_BAR', notes};
  }
  const dup = (useQr && seen && seen.has(qr.serial)) ? seen.get(qr.serial) : null;
  const dupTxt = dup ? `Sê-ri ${qr.serial} đã có trong sổ (${dup.at}, mã ${dup.pkg}). Nếu đây là nhãn khác thì nhà in đã in trùng mã.` : '';

  if(mode.ref === 'NONE'){
    if(owners.length) notes.push('Barcode này đăng ký cho: ' + owners.map(fgName).join('; ') + '.');
    if(dup) return {kl:'CẦN XÁC NHẬN', code:'DUP', why:dupTxt, notes};
    return {kl:'ĐẠT', why:'', code:'OK', notes};
  }

  if(mode.ref === 'TP'){
    if(!m || m.st !== 'OK') return {kl:'CẦN XÁC NHẬN', code:'NO_MASTER', notes,
      why:(useQr ? 'QR khớp barcode. ' : 'Đọc được barcode. ') + (m ? m.msg : 'Chưa chọn mã thành phẩm.') + ' Chưa đối chiếu được đúng sản phẩm.'};
    const hit = m.gtins.find(g => pad14(g.gtin) === pad14(bar.val));
    if(!hit){
      const own = owners.filter(o => o.item_tp !== m.row.item_tp);
      return {kl:'KHÔNG ĐẠT', code:'NE_FG', notes,
        why:`Barcode không thuộc thành phẩm ${m.row.item_tp}. Barcode đăng ký: ${m.gtins.map(g => g.gtin).join(', ')}.` +
            (own.length ? ` Barcode trên bao bì là của ${own.map(fgName).join('; ')}.` : '')};
    }
    const same = m.gtins.filter(g => g.cap === hit.cap);
    if(same.length > 1) notes.push(`Thành phẩm có ${same.length} barcode ${hit.cap === 'THUNG' ? 'thùng' : 'đơn vị'} đăng ký: ` +
      same.map(g => g.gtin + (g.ngay ? ` (${g.ngay})` : '')).join(', ') + `. Bao bì đang dùng ${hit.gtin}.`);
    const also = owners.filter(o => o.item_tp !== m.row.item_tp);
    if(also.length) notes.push('Barcode này cũng đăng ký cho: ' + also.map(fgName).join('; ') + '. QA đối chiếu HDĐG để chắc đang chạy đúng thành phẩm.');
    if(dup) return {kl:'CẦN XÁC NHẬN', code:'DUP', why:dupTxt, notes};
    return {kl:'ĐẠT', why:'', code:'OK', notes, hit:hit.gtin};
  }

  // PKG mode
  if(!m || m.st !== 'OK'){
    return {kl:'CẦN XÁC NHẬN', code:'NO_MASTER', notes,
      why:(useQr ? 'QR khớp barcode. ' : 'Đọc được barcode. ') + (m ? m.msg : 'Chưa chọn mã PKG.') +
          ' Chưa đối chiếu được đúng sản phẩm.' + (dup ? ' ' + dupTxt : '')};
  }
  if(pad14(bar.val) !== pad14(m.row.gtin)) return {kl:'KHÔNG ĐẠT', code:'NE_MASTER', notes, why: cap === 'DON_VI'
      ? (useQr ? 'QR và barcode khớp nhau nhưng khác master của mã PKG này. Có thể sai cuộn hoặc sai file thiết kế.' : 'Barcode khác master của mã PKG này. Có thể sai cuộn hoặc sai file thiết kế.')
      : 'Barcode thùng khác master của mã PKG này.'};
  if(dup) return {kl:'CẦN XÁC NHẬN', code:'DUP', why:dupTxt, notes};
  return {kl:'ĐẠT', why:'', code:'OK', notes};
}
const tone = kl => kl === 'ĐẠT' ? 'pass' : kl === 'KHÔNG ĐẠT' ? 'fail' : kl === 'CẦN XÁC NHẬN' ? 'warn' : 'none';

/* ====== storage ====== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ====== state ====== */
const S = { mode:{ref:'PKG', qr:true}, rows:[], napLuc:'', pkg:'', m:null, qr:null, bar:null, res:null, soMode:'may', soSite:[], sessionSeen:new Map() };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localIso = () => { const d = new Date(), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
const nowStr = () => { const d = new Date(), p = n => String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())} ${p(d.getDate())}/${p(d.getMonth()+1)}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function banner(text, kind){
  const b = $('banner');
  if(!text){ b.classList.add('hidden'); return; }
  b.className = 'banner ' + (kind || 'info'); b.textContent = text;
}

/* ====== station ====== */
async function callTram(body, {tries = 2, ms = 45000} = {}){
  if(/^DAN_/.test(tramUrl())) throw new Error('Chưa khai địa chỉ trạm trong qr.html');
  let err;
  for(let i = 0; i < tries; i++){
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
    try{
      const r = await fetch(tramUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), signal:ctl.signal});
      clearTimeout(t);
      const j = await r.json();
      if(!j.ok) throw new Error(j.error || 'Trạm báo lỗi');
      return j;
    }catch(e){ clearTimeout(t); err = e; }
  }
  throw err;
}

async function loadMaster(force){
  const c = store.get(K.master, null);
  if(c && !force){ S.rows = c.rows; S.napLuc = c.napLuc; renderMasterSt('bản lưu trên máy ' + c.at); fillList(); }
  try{
    $('masterSt').textContent = 'Đang tải master...';
    const j = await callTram({act:'qr_master'});
    S.rows = j.rows || []; S.napLuc = j.nap_luc || '';
    store.set(K.master, {rows:S.rows, napLuc:S.napLuc, at:nowStr()});
    renderMasterSt('tải lúc ' + nowStr()); fillList();
    if(S.pkg) choosePkg(S.pkg, true);
  }catch(e){
    if(S.rows.length) renderMasterSt('bản lưu trên máy ' + ((c && c.at) || '') + ', trạm lỗi');
    else { renderMasterSt('không có master'); banner('Không tải được master: ' + e.message + '. Không có master thì app không kết luận.', 'err'); }
  }
}
function renderMasterSt(t){
  const n = S.rows.filter(r => r.nguon === 'BO_SUNG' && r.trang_thai !== 'DA_DUYET').length;
  $('masterSt').textContent = `Master ${S.rows.length} dòng, ${t}` + (S.napLuc ? `, nạp ${S.napLuc}` : '') + (n ? `. ${n} đề xuất chờ duyệt` : '');
}
/* Search list like the date code app: type 2+ chars, tap a hit. Matches PKG code,
   FG item code, product name (accents optional) and barcode, current site only. */
const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toUpperCase();
// Search entries for step 1: PKG codes, or FG codes, at all sites
function entries(){
  if(S.mode.ref === 'TP'){
    const by = new Map();
    S.rows.filter(r => r.item_tp).forEach(r => {
      const k = r.item_tp + '|' + r.site;
      const e = by.get(k) || {key:r.item_tp, site:r.site, title:r.ten_sp, gt:new Set(), hay:[r.item_tp, r.ten_sp]};
      if(gtinValid(r.gtin) && (r.nguon === 'BO_SUNG' ? r.trang_thai === 'DA_DUYET' : true)) { e.gt.add(r.gtin); e.hay.push(r.gtin); }
      by.set(k, e);
    });
    return [...by.values()].map(e => Object.assign(e, {tag:`${e.gt.size} barcode`, cho:!e.gt.size, sub:''}));
  }
  return S.rows.map(r => ({key:r.ma_pkg, site:r.site, title:r.ten_sp, sub:r.item_tp ? 'TP ' + r.item_tp : '',
    tag:r.cap === 'THUNG' ? 'thùng' : 'nhãn', cho:r.trang_thai !== 'DA_DUYET', hay:[r.ma_pkg, r.item_tp, r.ten_sp, r.gtin]}));
}
function matchRows(q, list){
  const Q = fold(q).trim(); if(Q.length < 2) return [];
  const words = Q.split(/\s+/);
  return list.filter(e => { const hay = fold(e.hay.join(' ')); return words.every(w => hay.includes(w)); });
}
function hitHtml(e){
  const cho = e.cho ? `<span class="tag cho">${S.mode.ref === 'TP' ? 'chưa có barcode' : 'chờ duyệt'}</span>` : '';
  return `<div class="hit" role="option" tabindex="0" data-c="${esc(e.key)}"><div class="c">${esc(e.key)}<span class="tag">${esc(e.tag)}</span>${cho}</div>
    <div class="n">${esc(e.title)}${e.sub ? ' · ' + esc(e.sub) : ''}</div></div>`;
}
const uniqKey = list => { const seen = {}; return list.filter(e => seen[e.key] ? false : (seen[e.key] = 1)); };
function renderHits(){
  const box = $('hits'), site = $('site').value, q = $('pkg').value;
  if(!S.rows.length || S.mode.ref === 'NONE'){ box.innerHTML = ''; return; }
  const all = entries(), here = all.filter(e => e.site === site);
  const isTp = S.mode.ref === 'TP';
  if(fold(q).trim().length < 2){
    const rc = store.get(isTp ? K.recentTp : K.recent, []).map(c => here.find(e => e.key === c)).filter(Boolean);
    box.innerHTML = rc.length ? '<div class="listhead">Vừa kiểm gần đây</div>' + rc.map(hitHtml).join('')
      : `<div class="empty">Gõ 2 ký tự trở lên để tìm${site ? ' trong master ' + esc(site) : ''}. ${isTp ? 'Tìm theo mã thành phẩm, tên hoặc barcode.' : 'Tìm được theo mã PKG, mã TP, tên sản phẩm hoặc barcode.'}</div>`;
    return;
  }
  const list = uniqKey(matchRows(q, here)).slice(0, 40);
  if(list.length){ box.innerHTML = list.map(hitHtml).join(''); return; }
  const other = uniqKey(matchRows(q, all));
  box.innerHTML = other.length
    ? `<div class="empty">Không có mã nào của ${esc(site)} khớp. ${other.length} mã khớp nhưng khai cho site khác (${esc([...new Set(other.map(e => e.site || 'không rõ'))].join(', '))}). Kiểm lại site hoặc master.</div>`
    : `<div class="empty">Không có mã nào khớp trong master.${isTp ? '' : ' Nếu đúng mã trên phiếu nhập, bấm Chọn để ghi sổ lượt không có master.'}</div>`;
}
function fillList(){ if(!S.pkg) renderHits(); }
/* Chọn / Enter on typed text: exact code wins; one hit is taken; several hits
   are never guessed; in PKG mode no hit goes through as a no-master check. */
function pickTyped(){
  const raw = $('pkg').value.trim();
  const up = raw.toUpperCase();
  if(!raw) return choosePkg('');
  const all = entries();
  if(all.some(e => e.key === up)) return choosePkg(up);
  const site = $('site').value;
  const hits = [...new Set(matchRows(raw, all.filter(e => e.site === site)).map(e => e.key))];
  if(hits.length === 1) return choosePkg(hits[0]);
  if(hits.length > 1){ renderHits(); $('pkgInfo').innerHTML = `<div class="msg warn">Có ${hits.length} mã khớp. Chạm vào đúng mã trong danh sách.</div>`; return; }
  if(/^[A-Z0-9]{6,}$/.test(up)) return choosePkg(up);
  $('pkgInfo').innerHTML = `<div class="msg warn">Không tìm thấy mã nào khớp. Gõ đúng ${S.mode.ref === 'TP' ? 'mã thành phẩm' : 'mã PKG trên phiếu nhập'}.</div>`;
}

/* ====== ledger / queue ====== */
function queue(){ return store.get(K.queue, []); }
function renderQueue(){ const n = queue().length; $('queueSt').textContent = n ? `${n} lượt chưa gửi được` : ''; }
async function flush(){
  const q = queue();
  if(!q.length){ renderQueue(); return true; }
  try{
    await callTram({act:'qr_ghi', rows:q}, {tries:1, ms:30000});
    const sent = new Set(q.map(r => r.id_luot));
    store.set(K.queue, queue().filter(r => !sent.has(r.id_luot)));
    renderQueue(); return true;
  }catch(e){ renderQueue(); return false; }
}
function seenMap(){
  const m = new Map();
  const add = r => { if(r.seri && !m.has(r.seri)) m.set(r.seri, {at:(r.thoi_gian_tram || r.thoi_gian_may || '').slice(0,16), pkg:r.ma_pkg || r.item_tp || 'QR–barcode'}); };
  S.soSite.forEach(add); store.get(K.hist, []).forEach(add); queue().forEach(add);
  return m;
}
async function loadSo(){
  const site = $('site').value; if(!site) return;
  try{ const j = await callTram({act:'qr_so', site, n:300}, {tries:1, ms:30000}); S.soSite = j.rows || []; }catch(e){}
  renderSo();
}
function renderSo(){
  const site = $('site').value;
  const list = S.soMode === 'may' ? store.get(K.hist, []).filter(r => !site || r.site === site) : S.soSite;
  $('soList').innerHTML = list.length ? list.slice(0, 40).map(r => `
    <div class="lrow"><span class="dot ${tone(r.ket_luan)}"></span>
      <div><b>${esc(r.ma_pkg || r.item_tp || 'QR–barcode')}</b> ${esc(r.ket_luan)}<div class="t">${r.che_do ? esc(r.che_do) + ' · ' : ''}${esc(r.ly_do || r.ten_sp || '')}</div></div>
      <div class="who">${esc((r.thoi_gian_may || r.thoi_gian_tram || '').slice(5,16))}<br>${esc(r.nguoi_kiem)}</div></div>`).join('')
    : `<p class="hint">${S.soMode === 'may' ? 'Máy này chưa có lượt kiểm nào.' : 'Chưa tải được sổ của site.'}</p>`;
}

/* ====== scanner ====== */
const Scan = {
  inst:null, cancel:null,
  lib(){ const L = window.__Html5QrcodeLibrary__ || window; return L && L.Html5Qrcode ? L : null; },
  async open(kind){
    if(this.cancel) this.cancel();
    const L = this.lib();
    if(!L) throw new Error('Không tải được bộ quét. Kiểm tra mạng rồi tải lại trang.');
    const F = L.Html5QrcodeSupportedFormats;
    const formats = kind === 'qr' ? [F.QR_CODE]
      : kind === 'thung' ? [F.ITF, F.EAN_13, F.CODE_128]
      : kind === 'any' ? [F.EAN_13, F.EAN_8, F.UPC_A, F.ITF, F.CODE_128]
      : [F.EAN_13, F.EAN_8, F.UPC_A];
    $('camTtl').textContent = kind === 'qr' ? 'Quét QR' : 'Quét barcode';
    $('camSub').textContent = kind === 'qr' ? 'Đưa mã QR vào giữa khung, nghiêng nhãn nếu bị loá.' : 'Đưa vạch barcode nằm ngang trong khung.';
    $('cam').classList.add('open');
    this.inst = new L.Html5Qrcode('reader', {formatsToSupport:formats, verbose:false, experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    const box = kind === 'qr'
      ? (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return {width:s, height:s}; }
      : (w, h) => ({width:Math.floor(w * 0.9), height:Math.max(80, Math.floor(Math.min(h * 0.35, w * 0.45)))});
    return new Promise((resolve, reject) => {
      let last = null, n = 0, done = false;
      this.cancel = () => { if(done) return; done = true; this.close(); reject(new Error('huy')); };
      this.inst.start({facingMode:'environment'}, {fps:12, qrbox:box},
        (text, res) => {
          if(done) return;
          if(text === last) n++; else { last = text; n = 1; }
          if(n >= NEED_SAME_READS){
            done = true; this.close();
            let fmt = ''; try{ fmt = res.result.format.formatName; }catch(e){}
            resolve({text, fmt});
          }
        }, () => {}
      ).catch(e => { if(done) return; done = true; this.close(); reject(new Error('Không mở được camera. Cho phép camera cho trang này trong cài đặt trình duyệt rồi thử lại.')); });
    });
  },
  async close(){
    $('cam').classList.remove('open');
    const i = this.inst; this.inst = null;
    if(i){ try{ await i.stop(); }catch(e){} try{ i.clear(); }catch(e){} }
  }
};

/* ====== flow ====== */
function setStep(id, enabled, done){
  const el = $(id);
  el.setAttribute('aria-disabled', enabled ? 'false' : 'true');
  el.classList.toggle('done', !!done);
}
function resetScans(){
  S.qr = null; S.bar = null; S.res = null;
  $('qrInfo').innerHTML = ''; $('barInfo').innerHTML = ''; $('barInput').value = '';
  $('typeBar').classList.add('hidden'); $('result').classList.add('hidden'); $('result').innerHTML = '';
}
function ready(){
  if(!$('site').value){ banner('Chọn site trước khi kiểm.', 'err'); return false; }
  if(!$('nguoi').value.trim()){ banner('Nhập tên người kiểm trước khi kiểm.', 'err'); $('nguoi').focus(); return false; }
  banner(''); return true;
}

function useQrNow(){ return S.mode.ref === 'NONE' || (S.mode.qr && !(S.mode.ref === 'PKG' && capFor(S.m, S.pkg) === 'THUNG')); }
function applySteps(){
  const none = S.mode.ref === 'NONE', q = useQrNow(), have = none || !!S.pkg;
  $('s1').classList.toggle('hidden', none);
  $('s1t').textContent = S.mode.ref === 'TP' ? 'Mã thành phẩm đang chạy' : 'Mã PKG theo phiếu nhập';
  $('pkg').placeholder = S.mode.ref === 'TP' ? 'Gõ mã TP, tên hoặc barcode' : 'Gõ mã PKG, mã TP, tên hoặc barcode';
  $('s2').classList.toggle('hidden', !q);
  const n0 = none ? 0 : 1;
  $('n2').textContent = String(n0 + 1);
  $('n3').textContent = String(n0 + (q ? 2 : 1));
  setStep('s1', true, !!S.pkg);
  setStep('s2', have, !!S.qr);
  setStep('s3', have && (!q || !!S.qr), !!S.bar);
  $('s3t').textContent = S.mode.ref === 'TP' ? 'Quét barcode trên bao bì' : 'Quét barcode trên nhãn';
  $('modeLbl').textContent = 'Phạm vi: ' + MODE_LBL[modeKey(S.mode)];
  document.querySelectorAll('[data-ref]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ref === S.mode.ref)));
  document.querySelectorAll('[data-qr]').forEach(b => { b.setAttribute('aria-pressed', String((b.dataset.qr === '1') === S.mode.qr)); b.disabled = none && b.dataset.qr === '0'; });
}
function setMode(md){
  if(md.ref === 'NONE') md.qr = true;            // barcode alone has nothing to compare against
  S.mode = md; store.set(K.mode, md);
  resetScans(); S.pkg = ''; S.m = null; $('pkg').value = ''; $('pkgInfo').innerHTML = ''; $('hits').innerHTML = '';
  applySteps();
}
function choosePkg(raw, keepScans){
  if(!ready()) return;
  const pkg = String(raw || '').trim().toUpperCase();
  const isTp = S.mode.ref === 'TP';
  if(!pkg){ $('pkgInfo').innerHTML = `<div class="msg warn">Gõ ${isTp ? 'mã thành phẩm' : 'mã PKG'} hoặc tên sản phẩm rồi chọn trong danh sách.</div>`; $('pkg').focus(); return; }
  $('pkg').value = pkg; S.pkg = pkg;
  $('hits').innerHTML = '';
  const rk = isTp ? K.recentTp : K.recent;
  store.set(rk, [pkg, ...store.get(rk, []).filter(c => c !== pkg)].slice(0, 10));
  S.m = isTp ? resolveFG(S.rows, pkg, $('site').value) : resolveMaster(S.rows, pkg, $('site').value);
  if(!keepScans) resetScans();
  const r = S.m.row;
  let h = '';
  if(r && isTp){
    h += `<div class="prod"><b>${esc(r.ten_sp)}</b><div class="meta">TP ${esc(r.item_tp)}` +
      (S.m.gtins ? `, barcode đăng ký: ${esc(S.m.gtins.map(g => g.gtin + (g.cap === 'THUNG' ? ' (thùng)' : '')).join(', '))}` : '') + '</div></div>';
  } else if(r){
    h += `<div class="prod"><b>${esc(r.ten_sp)}</b><div class="meta">TP ${esc(r.item_tp)}, ${r.cap === 'THUNG' ? 'thùng' : 'nhãn đơn vị'}${r.quy_cach ? ', ' + esc(r.quy_cach) : ''}${r.nguon === 'BO_SUNG' ? ', theo master bổ sung' : ''}</div></div>`;
  }
  if(S.m.st !== 'OK') h += `<div class="msg warn">${esc(S.m.msg)} App vẫn kiểm được phần quét, nhưng chưa đối chiếu được đúng sản phẩm nên không cho ĐẠT.</div>`;
  $('pkgInfo').innerHTML = h;
  applySteps();
}

function onQr(text){
  S.qr = parseQR(text);
  $('qrInfo').innerHTML = `<div class="read">Đọc được: <b>${esc(S.qr.raw)}</b></div>` +
    (S.qr.ok ? '' : `<div class="msg bad">${esc(S.qr.why)}.</div>`);
  setStep('s2', true, true); setStep('s3', true, false);
  if(S.bar) finish();
}
function onBar(val, src, fmt){
  const v = String(val || '').replace(/\D/g, '');
  const norm = v.length === 12 ? '0' + v : v;   // UPC-A -> EAN-13
  S.bar = {val:norm, src, fmt:fmt || ''};
  $('barInfo').innerHTML = `<div class="read">Barcode: <b>${esc(norm)}</b>${src === 'go_tay' ? ' (gõ tay)' : ''}</div>`;
  setStep('s3', true, true);
  finish();
}

function cellsHtml(val, ref, len){
  if(!val) return '<div class="cells empty">không có</div>';
  const a = pad14(val).slice(14 - len), b = ref ? pad14(ref).slice(14 - len) : a;
  return '<div class="cells">' + [...a].map((c, i) => `<span class="${c !== b[i] ? 'x' : ''}">${c}</span>`).join('') + '</div>';
}

function finish(){
  const cap = capFor(S.m, S.pkg), q = useQrNow();
  if(q && !S.qr) return;                      // wait for QR
  if(!S.bar) return;
  if(S.mode.ref !== 'NONE' && !S.pkg) return;
  const seen = new Map([...seenMap(), ...S.sessionSeen]);
  const owners = ownersOf(S.rows, $('site').value, S.bar.val);
  S.res = verdict({mode:S.mode, m:S.m, qr:S.qr, bar:S.bar, seen, cap, owners});
  let gm = '';
  if(S.mode.ref === 'PKG' && S.m && S.m.st === 'OK') gm = S.m.row.gtin;
  if(S.mode.ref === 'TP' && S.m && S.m.st === 'OK') gm = S.res.hit || (S.m.gtins.find(g => g.gtin.length === S.bar.val.length) || S.m.gtins[0]).gtin;
  const len = [S.bar.val, gm].some(x => x && x.length === 14 && x[0] !== '0') ? 14 : 13;
  const ref = gm || S.bar.val;
  const rows = [];
  if(q) rows.push(['QR', S.qr && S.qr.gtin]);
  rows.push(['Barcode', S.bar.val]);
  if(S.mode.ref !== 'NONE') rows.push([S.mode.ref === 'TP' ? 'Đăng ký' : 'Master', gm]);
  const t = tone(S.res.kl);
  $('result').innerHTML = `
    <div class="verdict ${t}">
      <div class="kl">${esc(S.res.kl)}</div>
      <div class="scope">Phạm vi: ${esc(MODE_LBL[modeKey(S.mode)])}</div>
      ${S.res.why ? `<div class="why">${esc(S.res.why)}</div>` : ''}
      ${S.res.notes && S.res.notes.length ? `<div class="notes">${S.res.notes.map(n => `<p>${esc(n)}</p>`).join('')}</div>` : ''}
      <div class="digits">${rows.map(([l, v]) => `<div class="drow"><span class="lab">${l}</span>${cellsHtml(v, ref, len)}</div>`).join('')}</div>
      <div class="logst" id="logSt">Đang ghi sổ...</div>
    </div>
    <div class="after">
      <button class="btn pri" id="nextLabel" type="button">Quét nhãn tiếp</button>
      <button class="btn sec" id="newPkg" type="button">${S.mode.ref === 'NONE' ? 'Làm lại' : S.mode.ref === 'TP' ? 'Đổi mã TP' : 'Đổi mã PKG'}</button>
    </div>
    <div id="propose"></div>`;
  $('result').classList.remove('hidden');
  // same PKG, next label: open the camera straight away (the tap is the user gesture iOS needs)
  $('nextLabel').onclick = () => { resetScans(); if(S.pkg) choosePkg(S.pkg); else applySteps(); scan(useQrNow() ? 'qr' : barKind()); };
  $('newPkg').onclick = () => { setMode(S.mode); if(S.mode.ref !== 'NONE'){ renderHits(); $('pkg').focus(); } };
  feedback(t);
  $('result').scrollIntoView({block:'start', behavior:'smooth'});
  record();
  if(S.res.code === 'NO_MASTER' && S.mode.ref === 'PKG'){
    if(S.m && S.m.pending) bumpProposal();
    else proposeUI();
  }
}

/* ====== proposals: new PKG -> FG, approved by QA in the sheet ======
   The barcode written to master always comes from the barcode registration of the
   chosen FG, never from the scan (a master copied from the label proves nothing). */
function fgList(site, cap){
  const by = new Map();
  S.rows.filter(r => r.site === site && r.item_tp && (r.nguon !== 'BO_SUNG' || r.trang_thai === 'DA_DUYET'))
    .forEach(r => { if(!by.has(r.item_tp)) by.set(r.item_tp, {item_tp:r.item_tp, ten_sp:r.ten_sp, gtins:new Set()}); });
  fgPool(S.rows, site).filter(r => r.cap === cap).forEach(r => by.get(r.item_tp) && by.get(r.item_tp).gtins.add(r.gtin));
  return [...by.values()];
}
function proposeUI(){
  const box = $('propose'); if(!box) return;
  box.innerHTML = `<div class="step prop">
      <button class="btn sec wide" id="pOpen" type="button">Đề xuất thêm mã ${esc(S.pkg)} vào master</button>
      <div id="pBody" class="hidden">
        <h2>Thành phẩm theo phiếu nhập</h2>
        <p class="hint">Chọn theo phiếu nhập hoặc đơn mua hàng, không chọn theo tên in trên cuộn nhãn. Đề xuất chỉ có hiệu lực sau khi QA duyệt.</p>
        <div class="field"><input id="fgQ" autocomplete="off" spellcheck="false" placeholder="Gõ mã TP hoặc tên thành phẩm" aria-label="Tìm thành phẩm"></div>
        <div id="fgHits" class="hits" role="listbox"></div>
        <div id="fgPick"></div>
      </div></div>`;
  $('pOpen').onclick = () => { $('pOpen').classList.add('hidden'); $('pBody').classList.remove('hidden'); renderFg(); $('fgQ').focus(); };
  $('fgQ').addEventListener('input', () => { $('fgPick').innerHTML = ''; renderFg(); });
  $('fgHits').addEventListener('click', e => { const h = e.target.closest('.hit'); if(h) pickFg(h.dataset.c); });
}
function renderFg(){
  const site = $('site').value, cap = capFor(S.m, S.pkg), q = fold($('fgQ').value).trim();
  if(q.length < 2){ $('fgHits').innerHTML = '<div class="empty">Gõ 2 ký tự trở lên: mã TP (VD 03NM00936) hoặc tên.</div>'; return; }
  const words = q.split(/\s+/);
  const list = fgList(site, cap).filter(f => { const h = fold(f.item_tp + ' ' + f.ten_sp); return words.every(w => h.includes(w)); }).slice(0, 30);
  $('fgHits').innerHTML = list.length ? list.map(f => `<div class="hit" role="option" tabindex="0" data-c="${esc(f.item_tp)}">
      <div class="c">${esc(f.item_tp)}<span class="tag">${f.gtins.size} barcode</span></div><div class="n">${esc(f.ten_sp)}</div></div>`).join('')
    : `<div class="empty">Không có thành phẩm nào khớp trong master ${esc(site)}.</div>`;
}
function pickFg(tp){
  const site = $('site').value, cap = capFor(S.m, S.pkg);
  const f = fgList(site, cap).find(x => x.item_tp === tp); if(!f) return;
  const cands = [...f.gtins], scanned = S.bar.val;
  const match = cands.some(g => pad14(g) === pad14(scanned));
  const P = { ma_pkg:S.pkg, cap, site, item_tp:f.item_tp, ten_sp:f.ten_sp,
    gtin_dang_ky: cands.length === 1 ? cands[0] : '', barcode_dang_ky: cands.join(' / '),
    barcode_quet: scanned, khop_dang_ky: !cands.length ? 'CHUA_CO' : match ? 'CO' : 'KHONG',
    nguoi_de_xuat: $('nguoi').value.trim(), id_luot: S.lastId || '' };
  let note;
  if(!cands.length) note = `<div class="msg warn">Thành phẩm này chưa có barcode ${cap === 'THUNG' ? 'thùng' : 'đơn vị'} đăng ký ở ${esc(site)}. Đề xuất vẫn gửi được; người duyệt điền barcode theo file thiết kế đã duyệt.</div>`;
  else if(!match) note = `<div class="msg bad">Barcode trên nhãn (${esc(scanned)}) không nằm trong barcode đăng ký của thành phẩm này (${esc(cands.join(', '))}). Kiểm lại phiếu nhập. Nếu đúng thành phẩm thì cuộn này có thể sai, báo QA trước khi nhập kho.</div>`;
  else if(cands.length > 1) note = `<div class="msg warn">Thành phẩm có ${cands.length} barcode đăng ký (${esc(cands.join(', '))}). Barcode trên nhãn nằm trong số đó; người duyệt sẽ chốt barcode cho mã PKG này.</div>`;
  else note = `<div class="msg">Barcode trên nhãn khớp barcode đăng ký ${esc(cands[0])}.</div>`;
  $('fgHits').innerHTML = '';
  $('fgPick').innerHTML = `<div class="prod"><b>${esc(f.ten_sp)}</b><div class="meta">TP ${esc(f.item_tp)}</div></div>${note}
    <button class="btn pri wide" id="pSend" type="button" style="margin-top:10px">Gửi đề xuất</button><div id="pSt" class="hint"></div>`;
  $('pSend').onclick = () => sendProposal(P);
}
async function sendProposal(P){
  $('pSend').disabled = true; $('pSt').textContent = 'Đang gửi...';
  try{
    await callTram(Object.assign({act:'qr_de_xuat'}, P), {tries:2, ms:30000});
    S.rows.push({ma_pkg:P.ma_pkg, cap:P.cap, gtin:P.gtin_dang_ky, item_tp:P.item_tp, ten_sp:P.ten_sp, quy_cach:'', site:P.site,
                 trang_thai:'CHO_DUYET', ly_do:'đề xuất từ app', nguon:'BO_SUNG'});
    const c = store.get(K.master, null); if(c){ c.rows = S.rows; store.set(K.master, c); }
    S.m = resolveMaster(S.rows, S.pkg, $('site').value);
    renderMasterSt('vừa thêm đề xuất');
    $('pSend').classList.add('hidden');
    $('pSt').textContent = 'Đã gửi đề xuất. Mã này dùng được sau khi QA duyệt; trong lúc chờ, app vẫn kiểm QR khớp barcode.';
  }catch(e){
    $('pSend').disabled = false; $('pSt').textContent = 'Chưa gửi được: ' + e.message + '. Bấm gửi lại khi có mạng.';
  }
}
function bumpProposal(){
  const box = $('propose'); if(box) box.innerHTML = '<p class="hint">Mã này đã có đề xuất chờ QA duyệt. Lượt này được cộng vào số lần gặp của đề xuất.</p>';
  callTram({act:'qr_de_xuat', gap_lai:true, ma_pkg:S.pkg, site:$('site').value}, {tries:1, ms:30000}).catch(() => {});
}

function record(){
  const r = S.m && S.m.row;
  const rec = {
    thoi_gian_may:localIso(), site:$('site').value, nguoi_kiem:$('nguoi').value.trim(),
    ma_pkg:S.mode.ref === 'PKG' ? S.pkg : '', cap:S.mode.ref === 'PKG' ? capFor(S.m, S.pkg) : '',
    ten_sp:r ? r.ten_sp : '', item_tp:S.mode.ref === 'TP' ? S.pkg : (r ? r.item_tp : ''),
    gtin_master:!(S.m && S.m.st === 'OK') ? '' : S.mode.ref === 'TP' ? S.m.gtins.map(g => g.gtin).join(' / ') : r.gtin,
    nguon_master:r ? (r.nguon || '') : '',
    qr_raw:S.qr ? S.qr.raw : '', gtin_qr:S.qr ? (S.qr.gtin || '') : '', seri:S.qr && S.qr.ok ? S.qr.serial : '',
    barcode:S.bar.val, barcode_nguon:S.bar.src, ket_luan:S.res.kl, ly_do:S.res.why, ban_dung:BAN_DUNG,
    che_do:MODE_LBL[modeKey(S.mode)], ghi_chu:(S.res.notes || []).join(' '),
    id_luot:uid(), thiet_bi:(navigator.userAgent || '').replace(/^.*?\(([^)]*)\).*$/, '$1').slice(0, 60)
  };
  S.lastId = rec.id_luot;
  if(rec.seri) S.sessionSeen.set(rec.seri, {at:nowStr(), pkg:rec.ma_pkg || rec.item_tp || 'QR–barcode'});
  store.set(K.hist, [rec, ...store.get(K.hist, [])].slice(0, 200));
  store.set(K.queue, [...queue(), rec]);
  renderSo();
  flush().then(ok => {
    const el = $('logSt');
    if(el) el.textContent = ok ? 'Đã ghi sổ.' : 'Chưa ghi được sổ, app sẽ gửi lại khi có mạng.';
    if(ok && S.soMode === 'site') loadSo();
  });
}

function feedback(t){
  try{ navigator.vibrate && navigator.vibrate(t === 'pass' ? 80 : [120, 80, 120]); }catch(e){}
  try{
    const A = window.AudioContext || window.webkitAudioContext; if(!A) return;
    const ctx = new A(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = t === 'pass' ? 1320 : 330; g.gain.value = 0.08;
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + (t === 'pass' ? 0.12 : 0.35));
  }catch(e){}
}

function barKind(){ return S.mode.ref === 'TP' ? 'any' : (S.mode.ref === 'PKG' && capFor(S.m, S.pkg) === 'THUNG') ? 'thung' : 'don_vi'; }
async function scan(kind){
  if(!ready()) return;
  try{
    const {text, fmt} = await Scan.open(kind);
    if(kind === 'qr') onQr(text); else onBar(text, 'quet', fmt);
  }catch(e){
    if(e.message !== 'huy') banner(e.message, 'err');
  }
}

/* ====== wiring ====== */
function init(){
  $('ver').textContent = 'Bản dựng ' + BAN_DUNG;
  $('site').value = store.get(K.site, '');
  $('nguoi').value = store.get(K.nguoi, '');
  S.mode = Object.assign({ref:'PKG', qr:true}, store.get(K.mode, {}));
  if(!['PKG','TP','NONE'].includes(S.mode.ref)) S.mode = {ref:'PKG', qr:true};
  document.querySelectorAll('[data-ref]').forEach(b => b.addEventListener('click', () => setMode({ref:b.dataset.ref, qr:S.mode.qr})));
  document.querySelectorAll('[data-qr]').forEach(b => b.addEventListener('click', () => setMode({ref:S.mode.ref, qr:b.dataset.qr === '1'})));
  applySteps();
  $('site').addEventListener('change', () => { store.set(K.site, $('site').value); fillList(); S.soSite = []; renderSo(); loadSo(); if(S.pkg) choosePkg(S.pkg); });
  $('nguoi').addEventListener('change', () => store.set(K.nguoi, $('nguoi').value.trim()));
  $('pkgOk').addEventListener('click', pickTyped);
  $('pkg').addEventListener('keydown', e => { if(e.key === 'Enter') pickTyped(); });
  $('pkg').addEventListener('input', () => {
    if(S.pkg){ S.pkg = ''; S.m = null; resetScans(); $('pkgInfo').innerHTML = ''; applySteps(); }
    renderHits();
  });
  $('pkg').addEventListener('focus', () => { if(!S.pkg) renderHits(); });
  $('hits').addEventListener('click', e => { const h = e.target.closest('.hit'); if(h) choosePkg(h.dataset.c); });
  $('hits').addEventListener('keydown', e => { if(e.key === 'Enter'){ const h = e.target.closest('.hit'); if(h) choosePkg(h.dataset.c); } });
  $('scanQr').addEventListener('click', () => scan('qr'));
  $('scanBar').addEventListener('click', () => scan(barKind()));
  $('camClose').addEventListener('click', () => Scan.cancel && Scan.cancel());
  $('typeBarBtn').addEventListener('click', () => { $('typeBar').classList.remove('hidden'); $('barInput').focus(); });
  $('barOk').addEventListener('click', () => {
    const v = $('barInput').value.replace(/\D/g, '');
    if(!gtinValid(v) || !(v.length === 13 || v.length === 14 || v.length === 8)){
      $('barInfo').innerHTML = '<div class="msg bad">Số này sai số kiểm tra hoặc sai độ dài. Gõ lại đúng dãy số dưới vạch.</div>'; return;
    }
    onBar(v, 'go_tay');
  });
  $('soMay').addEventListener('click', () => { S.soMode = 'may'; $('soMay').setAttribute('aria-pressed', 'true'); $('soSite').setAttribute('aria-pressed', 'false'); renderSo(); });
  $('soSite').addEventListener('click', () => { S.soMode = 'site'; $('soSite').setAttribute('aria-pressed', 'true'); $('soMay').setAttribute('aria-pressed', 'false'); renderSo(); loadSo(); });
  $('reloadMaster').addEventListener('click', () => loadMaster(true));
  window.addEventListener('online', flush);
  renderSo(); renderQueue();
  loadMaster(false).then(() => { flush(); loadSo(); });
}
window.QRAPP = { gtinValid, pad14, parseQR, resolveMaster, resolveFG, ownersOf, verdict, capFor, fgList, setMode, S, Scan, flush };
document.addEventListener('DOMContentLoaded', init);
</script>
