<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiểm date code hàng xuất khẩu</title>
<style>
:root{
  --ink:#14181C; --steel:#68757C; --hair:#C7CFCE; --bg:#E4E8E7; --surface:#FFFFFF;
  --pass:#0E6F52; --fail:#A81D26; --warnbg:#F6DE9A; --band:#1B2126; --focus:#0B6BB5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 90px}

header{background:var(--band);color:#EDF1F0;padding:14px 14px 12px}
header .inner{max-width:560px;margin:0 auto}
header h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.srcline{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11.5px;color:#93A2A8}
.dot{width:7px;height:7px;border-radius:50%;background:#4E5D64;flex:none}
.dot.ok{background:#3FA07C} .dot.warn{background:#E8B10A}
.srcline button{margin-left:auto;background:none;border:1px solid #3A464C;color:#C6D2D6;
  padding:5px 10px;border-radius:3px;font-size:11.5px;cursor:pointer;font-family:inherit}
.who{display:flex;gap:8px;align-items:center;margin-top:10px}
.who input{flex:1;background:#141A1E;border:1px solid #3A464C;color:#E9F1F0;padding:8px 10px;
  border-radius:3px;font-size:13px;font-family:inherit}
.who input::placeholder{color:#6B7B82}
.who label{font-size:11px;color:#93A2A8;letter-spacing:.08em;text-transform:uppercase;flex:none;margin:0}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--hair);
  display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;padding:13px 4px 12px;font-family:inherit;font-size:12.5px;
  font-weight:600;color:var(--steel);cursor:pointer;border-top:2px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--band)}
nav .badge{display:inline-block;background:var(--fail);color:#fff;border-radius:9px;
  padding:0 5px;font-size:10.5px;margin-left:4px;vertical-align:1px}

.card{background:var(--surface);border:1px solid var(--hair);border-radius:4px;padding:14px;margin:12px 0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:8px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.hint{font-size:12px;color:var(--steel);margin-top:5px;line-height:1.45}
input,select,textarea{width:100%;padding:12px 11px;border:1px solid #AEB8B7;border-radius:3px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
input.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}
.field+.field{margin-top:13px}

#results{max-height:300px;overflow:auto;margin-top:8px;border:1px solid var(--hair);border-radius:3px}
.hit{padding:10px 11px;border-bottom:1px solid #EDF0EF;cursor:pointer}
.hit:last-child{border-bottom:none}
.hit:hover,.hit:focus{background:#F0F4F3;outline:none}
.hit .c{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700}
.hit .n{font-size:12.5px;color:var(--steel);margin-top:2px}
.listhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);
  padding:8px 11px;background:#F2F5F4;border-bottom:1px solid var(--hair);font-weight:700}

.chosen{border-left:3px solid var(--band)}
.chosen .code{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700}
.chosen .name{font-size:13.5px;color:#3E4A50;margin-top:3px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:2px;background:#EAEEED;color:#38444A}
.tag.amber{background:var(--warnbg);color:#5A3B00}
.strip{background:var(--band);border-radius:3px;padding:11px 12px;margin-top:11px}
.strip .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7E8E95;margin-bottom:6px}
.strip .row{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:#E9F4F0;
  letter-spacing:.1em;padding:2px 0}
.strip .row .k{color:#7E8E95;font-size:11.5px;letter-spacing:.06em;margin-right:8px}

.verdict{border-radius:4px;overflow:hidden;margin:12px 0}
.verdict .head{padding:16px 14px;color:#fff}
.verdict .head b{display:block;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.verdict .head span{display:block;font-size:12.5px;opacity:.88;margin-top:4px}
.v-pass .head{background:var(--pass)} .v-fail .head{background:var(--fail)}
.v-warn .head{background:var(--warnbg);color:#3D2800} .v-warn .head span{opacity:.75}
.verdict .body{background:#fff;border:1px solid var(--hair);border-top:none;padding:4px 0}
.line{display:flex;gap:10px;padding:11px 13px;border-bottom:1px solid #EEF1F0;align-items:flex-start}
.line:last-child{border-bottom:none}
.line .m{flex:none;width:17px;height:17px;border-radius:50%;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.m.ok{background:var(--pass)} .m.no{background:var(--fail)} .m.wa{background:#C99400}
.line .t{font-size:13.5px;line-height:1.45}
.line .t .d{color:var(--steel);font-size:12.5px;margin-top:3px;display:block}
.saved{background:#F2F5F4;border:1px solid var(--hair);border-top:none;border-radius:0 0 4px 4px;padding:11px 13px}
.saved .s{font-size:12px;color:var(--steel)}
.row2{display:flex;gap:8px;margin-top:9px}
.row2 button{flex:1}

button.go{width:100%;padding:15px;background:var(--band);color:#fff;border:none;border-radius:3px;
  font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit}
button.go:active{background:#2A343A}
button.ghost{width:100%;padding:11px;background:#fff;border:1px solid var(--hair);border-radius:3px;
  font-size:13px;cursor:pointer;font-family:inherit;color:#38444A}
.empty{text-align:center;color:var(--steel);font-size:13.5px;padding:26px 14px;line-height:1.6}

.log{background:#fff;border:1px solid var(--hair);border-radius:4px;overflow:hidden}
.logrow{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid #EEF1F0;align-items:flex-start}
.logrow:last-child{border-bottom:none}
.pill{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 6px;border-radius:2px;color:#fff;margin-top:2px}
.p-pass{background:var(--pass)} .p-fail{background:var(--fail)} .p-warn{background:#C99400}
.logrow .b{font-size:13px;line-height:1.4}
.logrow .b .s{display:block;color:var(--steel);font-size:11.5px;margin-top:2px}
.hidden{display:none}


.echo{font:12px ui-monospace,monospace;margin-top:4px;min-height:16px}
.echo.ok{color:#2E7D5B}.echo.no{color:#B4453A}
.suahop{margin-top:12px;padding:10px;border:1px solid #d8dcda;border-radius:8px;background:#fbfcfc;display:none}
.suahop label{display:block;font-size:13px;margin-bottom:6px;font-weight:600}
.suahop select{width:100%;padding:10px;border-radius:8px;border:1px solid #ccd2cf;font:14px system-ui}

#khoanh{display:none;margin-top:10px;border:1px solid #d8dcda;border-radius:10px;
        padding:10px;background:#fbfcfc}
#khoanhcv{width:100%;display:block;border-radius:6px;touch-action:none;background:#000}
#khoanhtt{font-size:13px;color:#5b6a70;margin:8px 0 6px}
.khoanhhang{display:flex;gap:8px;flex-wrap:wrap}
.khoanhhang button{flex:1;min-width:120px;padding:13px;border-radius:8px;border:none;
        font:600 15px system-ui;cursor:pointer}
#kh_doc{background:#123b2c;color:#fff}
#kh_ca,#kh_lai{background:#e6eae8;color:#22312c}

#xacnhan{display:none;margin-top:12px;border:2px solid #123b2c;border-radius:10px;padding:12px;background:#f2f7f4}
#xacnhan .may{font:600 17px ui-monospace,monospace;color:#123b2c;line-height:1.7;word-break:break-all}
#xacnhan .nhac{font-size:13px;color:#4a5a54;margin:8px 0 10px}
.xnhang{display:flex;gap:8px}
.xnhang button{flex:1;padding:15px;border:none;border-radius:8px;font:600 15px system-ui;cursor:pointer}
#xn_dung{background:#123b2c;color:#fff}
#xn_sai{background:#e6eae8;color:#22312c}
#mucanh{display:none;margin-top:12px;padding:12px;border-radius:10px;
        background:#4a3a12;color:#FBEFCB;font-size:14px;line-height:1.5}

.dong1{display:flex;align-items:center;gap:10px}
.dong1 h1{flex:1;margin:0}
#mocaidat{background:rgba(255,255,255,.10);color:#fff;border:none;border-radius:8px;
          width:40px;height:40px;font-size:19px;cursor:pointer;flex:0 0 auto}
.tomtat{font-size:12.5px;color:#93A2A8;margin-top:4px;font-variant-numeric:tabular-nums}
#caidat{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
/* ===== KHỐI CAMERA — thêm ===== */
#camboc{position:relative;width:100%;background:#000;overflow:hidden;border-radius:10px}
#camboc video{width:100%;display:block}
#camve{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.camhang{display:flex;gap:8px;margin-top:10px}
.camhang button{flex:1}
#camtt{font-size:12px;color:#93A2A8;margin-top:6px;font-variant-numeric:tabular-nums}
#camdoc{margin-top:10px;padding:10px;border-radius:8px;background:rgba(255,255,255,.04);
        font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;display:none}
.camnho{font-size:12px;color:#93A2A8;margin-top:6px}
</style>
</head>
<body>

<header>
  <div class="inner">
    <div class="dong1">
      <h1>Kiểm date code</h1>
      <button id="mocaidat" type="button" aria-label="Cài đặt">⚙</button>
    </div>
    <div class="tomtat" id="tomtat">—</div>

    <!-- Cài đặt: đặt một lần rồi ẩn. QC không cần nhìn mỗi ca. -->
    <div id="caidat">
      <div class="who">
        <label for="site">Nhà máy</label>
        <select id="site" style="flex:1;padding:10px;border-radius:8px"></select>
      </div>
      <div class="who">
        <label for="who">Người kiểm</label>
        <input id="who" placeholder="Họ tên hoặc mã nhân viên" autocomplete="name">
      </div>
      <div class="who">
        <label for="tram">Trạm đọc ảnh</label>
        <input id="tram" placeholder="Dán link .../exec của Apps Script" autocomplete="off" spellcheck="false">
      </div>
      <div class="srcline">
        <span class="dot" id="dot"></span><span id="srctxt">Đang tải master…</span>
        <button id="refresh" type="button">Cập nhật master</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <section id="tab-check">
    <div class="card">
      <div class="eyebrow">Bước 1 · Chọn sản phẩm</div>
      <input id="q" placeholder="Gõ mã item, tên, hoặc thị trường" autocomplete="off" spellcheck="false">
      <div id="results"></div>
    </div>
    <div id="item"></div>
    <div id="verdict"></div>
  </section>

  <section id="tab-log" class="hidden">
    <div class="card">
      <div class="eyebrow">Sổ kiểm trên máy này</div>
      <div class="hint" id="logsum"></div>
      <div class="row2">
        <button class="ghost" id="exp" type="button">Tải sổ về (.csv)</button>
        <button class="ghost" id="cp" type="button">Sao chép sổ</button>
      </div>
      <button class="ghost" id="clr" type="button" style="margin-top:8px">Xóa sổ</button>
      <div class="hint">Sổ nằm trong trình duyệt của máy này. Xóa lịch sử trình duyệt là mất.
        Cuối ca tải file .csv rồi đẩy lên thư mục QA của site.</div>
    </div>
    <div id="loglist"></div>
  </section>

  <div class="card" style="border:none;background:none;padding:0">
    <input type="file" id="file" accept=".csv,text/csv" hidden>
    <button class="ghost" type="button" id="pick">Nạp master từ file trong máy (.csv)</button>
  </div>
</div>

<nav>
  <button id="nav1" class="on" type="button">Kiểm</button>
  <button id="nav2" type="button">Sổ kiểm <span class="badge hidden" id="badge">0</span></button>
</nav>

<script>
/* ===== 1. LƯU TRỮ AN TOÀN (localStorage lỗi thì rơi về bộ nhớ tạm) ===== */
const MEM={};
const store={
  get(k){ try{ const v=localStorage.getItem(k); return v===null?(MEM[k]??null):v; }catch(e){ return MEM[k]??null; } },
  set(k,v){ MEM[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ===== 1b. TRẠM ĐỌC ẢNH =====
   URL mặc định gắn sẵn — QC không phải dán gì. Ô nhập ở đầu màn hình chỉ để
   đổi sang deployment khác khi cần, và chỉ đổi trên máy đó.
   PHẢI khai báo trước mọi chỗ dùng, nếu không sẽ đứt phần khởi tạo. */
var BAN_DUNG = 'b15 · nhãn train được';
var SITE_KY_TU = { MBP:'I', MIP:'A', MHP:'B', MGP:'M'' };
var SITE_TEN   = { MBP:'MMB — Nghệ An', MIP:'MSI', MHP:'MHP', MGP:'MGP' };
var SITE_APP   = store.get('dc_site') || 'MBP';
var TRAM_MAC_DINH = 'https://script.google.com/macros/s/AKfycbzFOhrxosY7-5yivMmhF9GtzsMMAFYdp0KfUKMucCJmktBqGm_udam2jm2hQH9zkf_X/exec';
var TRAM_URL = store.get('dc_tram') || TRAM_MAC_DINH;

/* ===== 2. MASTER DATA ===== */
/* Không nhúng master vào trang công khai. Bảng này chứa tên khách hàng,
   thị trường và hạn dùng — dữ liệu nội bộ. Nguồn duy nhất là Google Sheet
   qua trạm. Mất trạm thì app báo rõ, không chạy bằng bản chép cũ. */
const EMBEDDED_CSV = 'ma_item,ten_san_pham,site_ap_dung\n';
const MASTER_URL='master_datecode.csv';
let MASTER=[];

function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[]; let f='',row=[],q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else{ if(c==='"')q=true;
      else if(c===','){row.push(f);f='';}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
      else if(c!=='\r')f+=c; }
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length>1&&r[0]).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||'').trim());return o;});
}
/* Master dùng schema chuẩn (ma_item, dong1..4_*). Hàm check() vốn đọc
   item_code/segN_*. Chuyển ở đây thay vì sửa hàm kết luận đã chạy đúng. */
function chuanHoaMaster(rows){
  if(!rows.length) return rows;
  if(rows[0].item_code!==undefined) return rows;      // bảng đời cũ, để nguyên
  return rows.map(r=>{
    const o={
      item_code:r.ma_item, pkg_code:'', ten_san_pham:r.ten_san_pham,
      tu_khoa:r.tu_khoa||'', cap_bao_bi:r.cap_bao_bi||'',
      site_ap_dung:r.site_ap_dung||'', thi_truong:r.thi_truong||'',
      hsd_thang:r.so_thang_ap_dung||'', nguon_hsd:r.nguon_hsd||'',
      nguon_form:r.nguon_form||'', ghi_chu_in:r.ghi_chu_in||'',
      ghi_chu_tctp:'', canh_bao:r.canh_bao||'',
      trang_thai:(r.trang_thai_duyet==='DA_DUYET'&&!r.canh_bao)?'SAN_SANG':'THIEU_DU_LIEU'
    };
    for(let i=1;i<=4;i++){
      o['seg'+i+'_loai']  = r['dong'+i+'_loai']||'';
      o['seg'+i+'_nhan']  = r['dong'+i+'_nhan']||'';
      o['seg'+i+'_format']= r['dong'+i+'_mau_ngay']||'';
      o['seg'+i+'_them']  = r['dong'+i+'_thanh_phan']||'';
    }
    return o;
  });
}

function toCSV(rows,cols){
  const q=v=>{v=(v??'')+''; return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return '\uFEFF'+cols.join(',')+'\n'+rows.map(r=>cols.map(c=>q(r[c])).join(',')).join('\n');
}
async function loadMaster(){
  const dot=$('dot'), txt=$('srctxt');
  let loiTram='';
  const nhan=t=>{ txt.textContent=t+'  ·  '+BAN_DUNG; };
  nhan('Đang gọi trạm…');

  /* 1. Google Sheet qua trạm — nguồn thật. Có hạn giờ 20 giây: mạng xưởng
        chập chờn thì phải rơi xuống bản dự phòng, không được treo màn hình. */
  if(TRAM_URL){
    try{
      const bo=new AbortController();
      const hen=setTimeout(()=>bo.abort(),20000);
      let res;
      try{
        res=await fetch(TRAM_URL,{method:'POST',redirect:'follow',cache:'no-store',
          signal:bo.signal, headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({act:'master'})});
      } finally { clearTimeout(hen); }

      const chu=await res.text();
      let j=null;
      try{ j=JSON.parse(chu); }
      catch(_){
        /* Trạm trả HTML = deployment chưa có mã mới, hoặc quyền truy cập
           đang bắt đăng nhập nên Google trả về trang login. */
        throw new Error(chu.indexOf('<')===0
          ? 'trạm trả HTML chứ không phải JSON — deployment chưa cập nhật hoặc chưa mở quyền'
          : 'trạm trả nội dung lạ');
      }
      if(!j.ok) throw new Error(j.loi||'trạm báo lỗi');
      if(!j.csv) throw new Error('trạm không trả bảng master');

      const m=chuanHoaMaster(parseCSV(j.csv));
      if(!m.length||!m[0].item_code) throw new Error('bảng master sai cột');
      MASTER=m; dot.className='dot ok'; setTimeout(veTomTat,0);
      nhan(m.length+' item · Google Sheet'+(j.sua_luc?' · sửa '+j.sua_luc:''));
      buildDupIndex(); render(); return;
    }catch(e){
      loiTram=(e&&e.name==='AbortError')?'trạm không trả lời sau 20 giây':(e.message||'không gọi được trạm');
    }
  }

  /* 2. file CSV đặt cạnh index.html */
  try{
    const res=await fetch(MASTER_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw 0;
    const m=chuanHoaMaster(parseCSV(await res.text()));
    if(!m.length||!m[0].item_code) throw 0;
    MASTER=m; dot.className='dot ok'; nhan(m.length+' item · master_datecode.csv');
  }catch(e){
    /* 3. bản nhúng — chỉ để app không chết, KHÔNG phải nguồn thật */
    MASTER=chuanHoaMaster(parseCSV(EMBEDDED_CSV)); dot.className='dot warn';
    nhan(MASTER.length+' item · bản nhúng'+(loiTram?' · TRẠM LỖI: '+loiTram:''));
  }
  buildDupIndex(); render(); veTomTat();
}

/* item trùng tên gần giống → cảnh báo chọn nhầm quy cách */
let DUP={};
function nkey(s){ return s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'').slice(0,30); }
function buildDupIndex(){
  DUP={}; const c={};
  MASTER.forEach(r=>{const k=nkey(r.ten_san_pham); (c[k]=c[k]||[]).push(r.item_code);});
  Object.values(c).forEach(v=>{ if(v.length>1) v.forEach(code=>DUP[code]=v.filter(x=>x!==code)); });
}

/* ===== 3. ENGINE ===== */
const MMM=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const TOKRE=/MMM|YYYY|YY|MM|DD/g;
function splitFmt(fmt){const p=[];let last=0,m;TOKRE.lastIndex=0;
  while((m=TOKRE.exec(fmt))!==null){ if(m.index>last)p.push({sep:fmt.slice(last,m.index)});
    p.push({tok:m[0]}); last=m.index+m[0].length; }
  if(last<fmt.length)p.push({sep:fmt.slice(last)}); return p;}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function buildRe(fmt,loose){const parts=splitFmt(fmt);let re='^',order=[],prevTok=false;
  for(const p of parts){
    if(p.sep!==undefined){const s=p.sep.trim();
      if(loose)re+='[ ./\\-]*'; else if(s==='')re+='\\s*'; else re+='\\s*'+esc(s)+'\\s*';
      prevTok=false;}
    else{ if(loose&&prevTok)re+='[ ./\\-]*';
      order.push(p.tok);
      re += p.tok==='MMM'?'([A-Z]{3})':p.tok==='YYYY'?'(\\d{4})':'(\\d{2})';
      prevTok=true;}
  }
  return {re:new RegExp(re+'$'),order};}
function readDate(str,fmt,loose){
  const {re,order}=buildRe(fmt,loose);
  const m=String(str).trim().toUpperCase().match(re); if(!m)return null;
  let d=null,mo=null,y=null;
  order.forEach((t,i)=>{const v=m[i+1];
    if(t==='DD')d=+v; else if(t==='MM')mo=+v;
    else if(t==='MMM')mo=MMM.indexOf(v)+1||null;
    else if(t==='YYYY')y=+v; else if(t==='YY')y=2000+ +v;});
  if(!d||!mo||!y||mo<1||mo>12||d<1||d>31)return null;
  /* Chặn năm ngoài cửa sổ hợp lý. OCR đọc 160826 -> 160839 cho ra năm 2039;
     không chặn thì một cặp ngày vô lý vẫn có thể khớp phép trừ và cho ĐẠT. */
  const nayY=new Date().getUTCFullYear();
  if(y < nayY-3 || y > nayY+6) return null;
  const dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCDate()!==d||dt.getUTCMonth()!==mo-1)return null;
  return dt;}
function swapDM(fmt){ if(!/DD/.test(fmt)||!/MM/.test(fmt)||/MMM/.test(fmt))return null;
  const a=fmt.replace(/DD/,'\u0001').replace(/MM/,'DD').replace(/\u0001/,'MM');
  return a===fmt?null:a;}
function addMonths(dt,n){const y=dt.getUTCFullYear(),m=dt.getUTCMonth(),d=dt.getUTCDate();
  const last=new Date(Date.UTC(y,m+n+1,0)).getUTCDate();
  return new Date(Date.UTC(y,m+n,Math.min(d,last)));}
const fmtVN=dt=>String(dt.getUTCDate()).padStart(2,'0')+'/'+String(dt.getUTCMonth()+1).padStart(2,'0')+'/'+dt.getUTCFullYear();
const dayDiff=(a,b)=>Math.round((a-b)/86400000);
const LABELS=['BEST IF USED BY','BEST BEFORE','USE BY','BBF','BBD','EXP','MFG','NSX','HSD','LOT NO','LOT','PKD'];
function stripLabel(s){let t=String(s).trim().toUpperCase().replace(/^[:\s]+/,'');
  for(const L of LABELS) if(t.startsWith(L)) return {found:L,rest:t.slice(L.length).replace(/^[:\s.]+/,'')};
  return {found:null,rest:t};}

function segments(it){const o=[];for(let i=1;i<=4;i++){const k=it['seg'+i+'_loai'],f=it['seg'+i+'_format'];
  if(k&&f)o.push({i,kind:k,label:it['seg'+i+'_nhan'],fmt:f,them:it['seg'+i+'_them']||''});}return o;}

/**
 * LUẬT "PACK" — mốc tính HSD là ngày IN TRÊN BAO, không phải ngày QC gõ.
 * Ngày QC gõ chỉ để đối chiếu chéo: lệch nhau thì CẦN XÁC NHẬN (QC gõ nhầm,
 * hoặc máy in đang set sai ngày hệ thống), KHÔNG phải KHÔNG ĐẠT.
 * Tách hai lỗi này ra là chỗ quan trọng nhất: gộp chung thì lô tốt bị dừng
 * chỉ vì người gõ sai một số.
 * Bao bì không in NSX (hàng XK chỉ in BBF) thì mới lấy ngày lot làm mốc.
 */
function mocGoc(it,nsx,inputs){
  for(const s of segments(it)){
    if(s.kind!=='PROD') continue;
    const raw=(inputs[s.i]||'').trim(); if(!raw) continue;
    const {rest}=stripLabel(raw);
    const dt=readDate(rest,s.fmt,false)||readDate(rest,s.fmt,true);
    if(dt) return {moc:dt, tu:'bao', seg:s};
  }
  return {moc:nsx, tu:'lot', seg:null};
}

function check(it,nsx,inputs){
  const lines=[];let fail=false,warn=false;
  const months=parseInt(it.hsd_thang,10);
  const MG=mocGoc(it,nsx,inputs);
  const goc=MG.moc;
  if(MG.tu==='lot'){
    lines.push({m:'wa',t:'Mốc tính hạn',
      d:'Bao bì không đọc được ngày sản xuất — tạm lấy ngày lot '+fmtVN(nsx)+
        ' làm mốc. Kết luận hạn sử dụng dựa trên số QC nhập, không dựa trên bao bì.'});
    warn=true;
  }
  for(const s of segments(it)){
    const raw=(inputs[s.i]||'').trim();
    const title=(s.kind==='EXPIRY'?'Hạn sử dụng':s.kind==='PROD'?'Ngày sản xuất in trên bao':'Lot')+(s.label?' ('+s.label+')':'');
    if(!raw){lines.push({m:'wa',t:title,d:'Chưa nhập — không kết luận được ô này.'});warn=true;continue;}
    const {found,rest}=stripLabel(raw);
    if(s.label&&found&&found!==s.label){
      lines.push({m:'no',t:title,d:'In nhãn "'+found+'" nhưng tiêu chuẩn là "'+s.label+'".'});fail=true;}
    let dt=readDate(rest,s.fmt,false),sepIssue=false;
    if(!dt){dt=readDate(rest,s.fmt,true); if(dt)sepIssue=true;}
    if(!dt){
      const a0=swapDM(s.fmt),d0=a0?readDate(rest,a0,true):null;
      if(d0) lines.push({m:'no',t:'Nghi in nhầm thứ tự ngày/tháng',
        d:'"'+rest+'" không đọc được theo '+s.fmt+', nhưng đọc được thành '+fmtVN(d0)+' theo kiểu '+a0+
          '. Thị trường '+(it.thi_truong||'này')+' phải in '+s.fmt+'. Kiểm tra cấu hình máy in.'});
      else lines.push({m:'no',t:title,d:'"'+rest+'" không khớp tiêu chuẩn '+s.fmt+'. Kiểm tra số ký tự và thứ tự ngày/tháng/năm.'});
      fail=true;continue;}
    if(sepIssue){lines.push({m:'no',t:title,
      d:'Đọc được ngày '+fmtVN(dt)+' nhưng sai dấu phân cách hoặc khoảng trắng. Tiêu chuẩn: '+s.fmt});fail=true;}
    if(s.kind==='PROD'){
      const dd=dayDiff(dt,nsx);
      if(dd===0)lines.push({m:'ok',t:title,d:fmtVN(dt)+' — khớp ngày sản xuất QC nhập.'});
      else{lines.push({m:'wa',t:title,
        d:'Bao in '+fmtVN(dt)+', QC nhập '+fmtVN(nsx)+' (lệch '+dd+' ngày). '+
          'Hạn sử dụng vẫn tính theo ngày IN TRÊN BAO. Kiểm hai khả năng: QC nhập nhầm, '+
          'hoặc máy in đang set sai ngày hệ thống.'});warn=true;}
    } else if(s.kind==='EXPIRY'){
      if(isNaN(months)){lines.push({m:'wa',t:title,d:'Đọc được '+fmtVN(dt)+' nhưng master chưa có hạn sử dụng TCTP — không tính được.'});warn=true;}
      else{const exp=addMonths(goc,months),dd=dayDiff(dt,exp);
        /* Khớp tuyệt đối. KHÔNG có dung sai ±1 ngày: máy in chạy tự động theo
           ngày thật, lệch một ngày là máy set sai chứ không phải quy ước. */
        if(dd===0)lines.push({m:'ok',t:title,
          d:fmtVN(dt)+' — đúng '+fmtVN(goc)+' + '+months+' tháng'+
            (MG.tu==='bao'?' (theo ngày in trên bao).':' (theo ngày lot QC nhập).')});
        else lines.push({m:'no',t:title,
          d:'In '+fmtVN(dt)+', đúng phải là '+fmtVN(exp)+' ('+fmtVN(goc)+' + '+months+
            ' tháng). Lệch '+dd+' ngày.'}),fail=true;}
    } else lines.push({m:'ok',t:title,d:'Đọc được '+fmtVN(dt)+'.'});
    const alt=swapDM(s.fmt);
    if(alt){const adt=readDate(rest,alt,true);
      if(adt&&adt.getTime()!==dt.getTime()){
        let msg='Chuỗi này cũng đọc được thành '+fmtVN(adt)+' theo kiểu '+alt+'. ';
        if(s.kind==='EXPIRY'&&!isNaN(months)){
          const exp=addMonths(goc,months);
          if(dayDiff(adt,exp)===0&&dayDiff(dt,exp)!==0){
            lines.push({m:'no',t:'Nghi in nhầm thứ tự ngày/tháng',
              d:msg+'Cách đọc thứ hai lại đúng hạn. Nhiều khả năng máy in đang set '+alt+' thay vì '+s.fmt+'. Dừng và kiểm tra máy in.'});
            fail=true;continue;}}
        lines.push({m:'wa',t:'Ngày có thể đọc hai cách',
          d:msg+'Thị trường '+(it.thi_truong||'này')+' dùng '+s.fmt+' — xác nhận đúng chiều trước khi chạy.'});warn=true;}}
  }
  return {lines,fail,warn};
}

/* Chỉ hiện mã có khai cho nhà máy đang chọn. Mã không khai cho site này
   mà vẫn kiểm được thì đó là lỗi master, không phải chuyện app tự nới ra. */
function hopSite(r){
  if(!r.site_ap_dung) return true;               // bảng đời cũ không có cột site
  return r.site_ap_dung.toUpperCase().indexOf(SITE_APP)>=0;
}
function render(){
  const q=$('q').value.trim().toUpperCase(), box=$('results');
  let head='', list=[];
  if(q.length<2){
    /* Lọc site cho cả danh sách gần đây. Trước đây nhánh này bỏ qua hopSite,
       nên mã 03NM00443 chỉ khai cho MIP vẫn hiện ở MBP và bị đem đi kiểm. */
    const rc=recents().map(c=>MASTER.find(r=>r.item_code===c)).filter(Boolean).filter(hopSite);
    if(!rc.length){ box.innerHTML='<div class="empty">Gõ 2 ký tự trở lên để tìm.<br>Các mã vừa kiểm sẽ hiện sẵn ở đây.</div>'; return; }
    head='Vừa kiểm gần đây'; list=rc;
  } else {
    head=''; list=MASTER.filter(hopSite).filter(r=>r.item_code.toUpperCase().includes(q)
      ||r.ten_san_pham.toUpperCase().includes(q)
      ||(r.tu_khoa||'').toUpperCase().includes(q)
      ||(r.thi_truong||'').toUpperCase()===q).slice(0,40);
    if(!list.length){
      const ngoai=MASTER.filter(r=>!hopSite(r)).filter(r=>r.item_code.toUpperCase().includes(q)
        ||r.ten_san_pham.toUpperCase().includes(q)||(r.tu_khoa||'').toUpperCase().includes(q));
      if(ngoai.length) head='Không có mã nào của '+SITE_APP+
        '. '+ngoai.length+' mã khớp nhưng khai cho nhà máy khác — kiểm lại master.';
    }
  }
  box.innerHTML=(head?'<div class="listhead">'+head+'</div>':'')+
    (list.length?list.map(r=>`<div class="hit" tabindex="0" data-c="${r.item_code}">
      <div class="c">${r.item_code}${r.thi_truong?' · '+r.thi_truong:''}</div>
      <div class="n">${r.ten_san_pham}${r.tu_khoa?' · '+r.tu_khoa:''}</div></div>`).join('')
     :'<div class="empty">Không có item nào khớp.</div>');
}

/* Ô nào máy điền, ô nào người sửa — tách bạch để sau này dựng bảng nhầm lẫn.
   Không có cái này thì mọi ô đều là "người gõ", không học được gì. */
var AUTOFILL={}, DA_SUA={}, MAY_DIEN={}, SO_CAP=0;
/* Nhãn dùng để train phải có ĐÚNG MỘT cách viết. Trước đây người gõ tự do nên
   cùng một nội dung ra ba kiểu: "NSX 040926 | HSD 040327", "040926 | 040227",
   "HSD 040227". Máy không học được từ ba mã hoá cho một thứ.
   Khuôn duy nhất: mỗi dòng "NHAN:DDMMYY", viết hoa, không khoảng trắng. */
function nhanChuanHoa(segs, inputs, maMay){
  const dong=[];
  segs.forEach(function(s){
    if(!s.label) return;
    const raw=String(inputs[s.i]||'').trim(); if(!raw) return;
    const sl=stripLabel(raw);
    const dt=readDate(sl.rest, s.fmt, true);
    if(!dt) return;
    dong.push(String(s.label).toUpperCase().replace(/\s+/g,'')+':'+
              String(sl.rest).toUpperCase().replace(/\s+/g,''));
  });
  const m=String(maMay||'').toUpperCase().replace(/\s+/g,'');
  if(m) dong.push('MAY:'+m);
  return dong.join('\n');
}

function danhDauSua(i,giaTri){
  if(AUTOFILL[i]===undefined) return;
  const khac = String(giaTri).toUpperCase().replace(/[^A-Z0-9]/g,'')
             !== String(AUTOFILL[i]).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(khac) DA_SUA[i]=giaTri; else delete DA_SUA[i];
  const hop=document.getElementById('suahop');
  if(hop) hop.style.display = Object.keys(DA_SUA).length ? 'block' : 'none';
}

  `<div class="hint">Gõ nguyên văn theo đúng thứ tự đang in, kể cả nhãn và dấu chấm/gạch.</div>
   <div style="margin-top:14px"><button class="go" type="button" id="run">Kiểm tra và ghi sổ</button></div></div>`;

  $('item').innerHTML=h;
  $('run').onclick=run;

  /* Echo trực tiếp: gõ tới đâu hiện ngay máy hiểu thành ngày nào.
     Chặn gõ bừa mà không cần khoá cứng ô nhập. */
  segs.forEach(sg=>{
    const o=$('in'+sg.i), e=$('ec'+sg.i); if(!o||!e) return;
    const ve=()=>{
      const v=o.value.trim();
      if(!v){ e.textContent=''; e.className='echo';
              if(AUTOFILL[sg.i]!==undefined) danhDauSua(sg.i,o.value); return; }
      const dt=readDate(stripLabel(v).rest, sg.fmt, true);
      e.textContent = dt ? '→ '+fmtVN(dt) : '→ chưa đọc được theo '+sg.fmt;
      e.className = 'echo '+(dt?'ok':'no');
      danhDauSua(sg.i,o.value);
    };
    o.addEventListener('input',ve); ve();
  });

  const om=$('inmay'), em=$('ecmay');
  if(om&&em){
    const vm=()=>{
      const t=om.value.trim().toUpperCase().replace(/\s+/g,'');
      if(!t){ em.textContent=''; em.className='echo'; }
      else if(/^[0-9]{1,2}[A-Z0-9]$/.test(t)){
        const kt=t.slice(-1);
        const dung = (kt===SITE_KY_TU[SITE_APP]) ||
                     ((SITE_KY_TU[SITE_APP]==='I') && kt==='1');
        em.textContent = dung ? '→ line '+t.slice(0,-1)+', nhà máy '+SITE_APP
                              : '→ ký tự cuối "'+kt+'" không phải của '+SITE_APP;
        em.className='echo '+(dung?'ok':'no');
      } else { em.textContent='→ chưa đúng dạng (1-2 số + 1 ký tự)'; em.className='echo no'; }
      danhDauSua('may', om.value);
    };
    om.addEventListener('input',vm); vm();
  }
  if(TRAM_URL) camKhoiDong(segs);
}

function run(){
  const v=$('nsx').value;
  if(!v){alert('Chưa nhập ngày sản xuất theo lot.');return;}
  const who=$('who').value.trim();
  if(!who){alert('Nhập tên người kiểm ở đầu màn hình trước.');$('who').focus();return;}
  store.set('dc_user',who);

  const p=v.split('-'), nsx=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  const segs=segments(CUR), inputs={};
  segs.forEach(s=>inputs[s.i]=(($('in'+s.i)||{}).value||'').trim());

  /* BẮT BUỘC ĐỦ TRƯỜNG. Hai ca KHÔNG ĐẠT trong đợt test đều là do chỉ điền một
     trường: thiếu NSX thì mốc rơi về ngày lot người gõ, không còn là kiểm bao bì. */
  const thieu=segs.filter(s=>s.label && !inputs[s.i]);
  if(thieu.length){
    alert('Còn trống: '+thieu.map(s=>s.label).join(', ')+
          '.\nĐọc trên bao bì và điền đủ. Không đọc được thì gõ dấu ? rồi báo Leader.');
    const o=$('in'+thieu[0].i); if(o) o.focus();
    return;
  }
  const maMay=(($('inmay')||{}).value||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!maMay){
    alert('Chưa điền mã máy đóng gói.\nNó nằm ở cuối dòng hạn sử dụng, VD 13I.');
    const o=$('inmay'); if(o) o.focus();
    return;
  }

  const r=check(CUR,nsx,inputs);
  const noData=CUR.trang_thai!=='SAN_SANG';
  let cls,head,sub;
  if(noData){cls='v-warn';head='KHÔNG KẾT LUẬN ĐƯỢC';sub='Master thiếu dữ liệu — không được coi là đạt.';}
  else if(r.fail){cls='v-fail';head='KHÔNG ĐẠT';sub='Dừng, không chạy đơn. Báo QA.';}
  else if(r.warn){cls='v-warn';head='CẦN XÁC NHẬN';sub='Có điểm chưa chắc chắn — ghi rõ ai xác nhận và căn cứ gì.';}
  else{cls='v-pass';head='ĐẠT';sub='Khớp tiêu chuẩn in và đúng hạn theo TCTP.';}

  /* gửi kết quả cuối về sổ chung của trạm — để đo 2 cột chỉ số */
  if(TRAM_URL && LAST_OCR && LAST_OCR.id){
    const lyDo=($('lydosua')&&$('lydosua').value)||'';

    /* Nhãn để train: một khuôn duy nhất, phủ trọn khối chữ in của MỘT gói. */
    const nhan=nhanChuanHoa(segs, inputs, maMay);
    /* Máy đã tự điền gì, TRƯỚC khi người sửa — không có cột này thì không tính
       được sai ngầm, và không dựng được bảng nhầm lẫn. */
    const mayDien=nhanChuanHoa(segs,
      Object.assign({}, inputs, MAY_DIEN), MAY_DIEN['may']||'');

    fetch(TRAM_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({act:'ketqua',id:LAST_OCR.id,
        chuoi_xac_nhan:nhan, may_dien:mayDien, ma_may:maMay,
        ket_luan:head, ly_do:sub,
        ly_do_chi_tiet:r.lines.filter(l=>l.m!=='ok').map(l=>l.t+': '+l.d).join(' || '),
        ngay_sx:v, line:(maMay.length>1?maMay.slice(0,-2)||maMay.slice(0,1):''),
        ly_do_sua:lyDo, o_da_sua:Object.keys(DA_SUA).join(';'),
        che_do:CHE_DO, giay_xac_nhan:GIAY_XN.toFixed(1), ban_dung:BAN_DUNG,
        so_cap_ngay:SO_CAP, nhieu_goi:(SO_CAP>2),
        may_doc:(LAST_OCR.dong||[]).join(' | ')})}).catch(()=>{});
    LAST_OCR=null;
  }

  /* ghi sổ NGAY, trước khi hiện kết quả */
  LASTID='c'+Date.now();
  const rec={id:LASTID,thoi_gian:new Date().toLocaleString('vi-VN'),nguoi_kiem:who,
    item_code:CUR.item_code,ten_san_pham:CUR.ten_san_pham,thi_truong:CUR.thi_truong,
    ngay_sx:fmtVN(nsx),chuoi_in:segs.map(s=>inputs[s.i]).filter(Boolean).join(' / '),
    ket_luan:head,ly_do:r.lines.filter(l=>l.m!=='ok').map(l=>l.d).join(' | '),ghi_chu:'',
    nguon_master:$('dot').className.includes('ok')?'file':'nhúng'};
  const log=readLog(); log.push(rec); writeLog(log);
  pushRecent(CUR.item_code);

  $('verdict').innerHTML=`<div class="verdict ${cls}">
    <div class="head"><b>${head}</b><span>${sub}</span></div>
    <div class="body">${r.lines.map(l=>`<div class="line"><span class="m ${l.m}">${l.m==='ok'?'✓':l.m==='no'?'✕':'!'}</span>
      <span class="t"><b>${l.t}</b><span class="d">${l.d}</span></span></div>`).join('')}</div>
    <div class="saved">
      <div class="s">Đã ghi sổ lúc ${rec.thoi_gian} · ${who}</div>
      ${head!=='ĐẠT'?`<div class="field" style="margin-top:9px">
        <label>Ghi chú / người xác nhận</label>
        <input id="note" placeholder="VD: đã chỉnh máy in, chạy lại lô — anh X duyệt"></div>`:''}
      <div class="row2">
        ${head!=='ĐẠT'?`<button class="ghost" type="button" id="savenote">Lưu ghi chú</button>`:''}
        <button class="ghost" type="button" id="copy">Sao chép kết quả</button>
        <button class="ghost" type="button" id="again">Kiểm mã khác</button>
      </div>
    </div></div>`;

  const sn=$('savenote');
  if(sn) sn.onclick=()=>{
    const log=readLog(), i=log.findIndex(x=>x.id===LASTID);
    if(i>=0){log[i].ghi_chu=$('note').value.trim();writeLog(log);sn.textContent='Đã lưu ghi chú';}
  };
  $('copy').onclick=()=>{
    const t=[head,rec.item_code+' · '+rec.ten_san_pham,'NSX theo lot: '+rec.ngay_sx,
      'Chuỗi in: '+rec.chuoi_in,...r.lines.map(l=>(l.m==='ok'?'[OK] ':l.m==='no'?'[LỖI] ':'[!] ')+l.t+' — '+l.d),
      'Người kiểm: '+who+' · '+rec.thoi_gian].join('\n');
    navigator.clipboard?.writeText(t).then(()=>$('copy').textContent='Đã sao chép',
      ()=>alert(t));
  };
  $('again').onclick=()=>{CUR=null;$('item').innerHTML='';$('verdict').innerHTML='';
    $('q').focus();window.scrollTo({top:0,behavior:'smooth'});render();};

  $('verdict').scrollIntoView({behavior:'smooth',block:'start'});
}

  $('logsum').textContent = n? `${n} lượt kiểm · ${f} lượt KHÔNG ĐẠT` : 'Chưa có lượt kiểm nào trên máy này.';
  $('loglist').innerHTML = l.length? '<div class="log">'+l.map(r=>{
    const p=r.ket_luan==='ĐẠT'?'p-pass':r.ket_luan==='KHÔNG ĐẠT'?'p-fail':'p-warn';
    return `<div class="logrow"><span class="pill ${p}">${r.ket_luan}</span>
      <span class="b">${r.item_code} · ${r.thi_truong||''}
      <span class="s">${r.thoi_gian} · ${r.nguoi_kiem} · NSX ${r.ngay_sx} · in "${r.chuoi_in}"
      ${r.ghi_chu?'<br>Ghi chú: '+r.ghi_chu:''}</span></span></div>`;
  }).join('')+'</div>' : '';
}

/* ==================================================================

/* TRAM_URL đã khai báo ở đầu file — KHÔNG khai báo lại ở đây.
   Khai báo bằng let ở cuối file sẽ ném ReferenceError cho mọi dòng dùng nó
   phía trên (vùng chết tạm thời), làm đứt cả phần khởi tạo. */

const ROWS_COLS_MAX = 110;   // ~9% diện tích lưới 40x30
const CAM = {
  COLS: 40, ROWS: 30,
  NHAY: 78,
  MOI_GIAY: 8,        // chỉ dò 8 lần/giây, không dò mỗi khung hình
  LAM_MUOT: 0.25,     // hệ số trượt toạ độ khung
  CAN_LIEN: 3,        // phải thấy 3 lần liên tiếp mới vẽ khung
  GIU_KHUNG: 10       // mất dấu thì vẫn giữ khung thêm 10 vòng
};

var LAST_OCR=null, KQ_TACH=null;

/* ============================================================
   KIỂM MÙ — cứ 1 trong TAN_SUAT_MU lượt, máy KHÔNG hiện kết quả đọc,
   QC phải gõ tay từ bao bì. Sau đó trạm so chuỗi người gõ với chuỗi máy đọc.

   Vì sao bắt buộc có: một bộ đọc duy nhất cộng nút "Đúng" một chạm là con dấu
   cao su. QC ca ba sẽ bấm mà không nhìn bao. Lượt mù là cách DUY NHẤT đo được
   tỷ lệ sai ngầm thật, và nó cũng khiến việc bấm bừa không còn an toàn vì
   không ai biết lượt nào là lượt mù.

   Trong công cụ gán nhãn hồi train, việc này do PHIẾU BẦU của hai bộ đọc đảm
   nhiệm. Trên line hiện chỉ có một bộ đọc, nên phải bù bằng người.
   ============================================================ */
/* PILOT dùng 1/4. Với 18 lượt/ngày, 1/4 cho 63 lượt mù sau 14 ngày ->
   chặn trên 95% của tỷ lệ sai ngầm ~4.6% nếu không thấy lỗi nào.
   Để 1/8 thì phải chạy 26 ngày mới đạt cùng độ mạnh. Sau pilot hạ về 8 hoặc 12. */
var TAN_SUAT_MU = 4;
var GIAY_XN=0;
var CHE_DO='THUONG';         // THUONG | MU
var T0_XACNHAN=0;            // mốc thời gian để đo giây xác nhận

function laLuotMu(){
  var n=0; try{ n=parseInt(store.get('dc_dem_luot')||'0',10)||0; }catch(e){}
  n++; try{ store.set('dc_dem_luot',String(n)); }catch(e){}
  return n % TAN_SUAT_MU === 0;
}
let camStream=null, camSau=true, camSegs=[], camRAF=null;
let camLuoi=null, camLctx=null;
let camKhung=null, camDem=0, camMat=0, camNguongEMA=null, camLanCuoi=0, camCaoGoc=null;

function camKhoiDong(segs){
  camSegs=segs;
  camLuoi=document.createElement('canvas');
  camLuoi.width=CAM.COLS*8; camLuoi.height=CAM.ROWS*8;
  camLctx=camLuoi.getContext('2d',{willReadFrequently:true});
  camKhung=null; camDem=0; camMat=0; camNguongEMA=null;
  document.getElementById('camchup').onclick=camChup;
  document.getElementById('camdoi').onclick=()=>{camSau=!camSau;camMo();};
  ganSuKienKhoanh();

  /* Đúng -> chạy thẳng kết luận. Sai -> mở ô sửa, ghi lý do.
     Cả hai nhánh đều đi qua đúng phép trừ số học, không có đường tắt. */
  const nDung=document.getElementById('xn_dung'), nSai=document.getElementById('xn_sai');
  if(nDung) nDung.onclick=()=>{
    GIAY_XN=(Date.now()-T0_XACNHAN)/1000;
    document.getElementById('xacnhan').style.display='none';
    const r=document.getElementById('run'); if(r) r.click();
  };
  if(nSai) nSai.onclick=()=>{
    GIAY_XN=(Date.now()-T0_XACNHAN)/1000;
    document.getElementById('xacnhan').style.display='none';
    const h=document.getElementById('suahop'); if(h) h.style.display='block';
    const o=$('in'+(camSegs[0]||{i:1}).i); if(o){ o.focus(); o.select&&o.select(); }
  };
  document.getElementById('camchon').onclick=()=>document.getElementById('camfile').click();
  document.getElementById('camfile').onchange=e=>{
    if(e.target.files&&e.target.files[0]) camChonAnh(e.target.files[0]);
    e.target.value='';
  };
  camMo();
}

async function camMo(){
  if(camStream) camStream.getTracks().forEach(t=>t.stop());
  const v=document.getElementById('camv'); if(!v) return;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:camSau?'environment':'user',width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=camStream; await v.play();
    document.getElementById('camtt').textContent='đang quét';
    if(camRAF) cancelAnimationFrame(camRAF);
    camVong();
  }catch(e){
    document.getElementById('camtt').innerHTML=
      'Không mở được camera. Trang phải mở qua <b>https</b> — dùng đúng link github.io, '+
      'không mở file đã tải về.';
  }
}

/* ---- dò vùng: vùng sáng có nhiều đốm tối nhỏ ---- */
function camDoVung(){
  const v=document.getElementById('camv');
  camLctx.drawImage(v,0,0,camLuoi.width,camLuoi.height);
  const d=camLctx.getImageData(0,0,camLuoi.width,camLuoi.height).data;
  const W=camLuoi.width, cw=W/CAM.COLS, ch=camLuoi.height/CAM.ROWS;
  const sang=new Float32Array(CAM.ROWS*CAM.COLS), bien=new Float32Array(CAM.ROWS*CAM.COLS);
  for(let r=0;r<CAM.ROWS;r++)for(let c=0;c<CAM.COLS;c++){
    let tong=0,tb=0,n=0; const y0=(r*ch)|0,x0=(c*cw)|0;
    for(let y=y0;y<y0+ch;y++){ let tr=-1;
      for(let x=x0;x<x0+cw;x++){
        const i=(y*W+x)*4, g=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;
        tong+=g; n++; if(tr>=0) tb+=Math.abs(g-tr); tr=g; } }
    sang[r*CAM.COLS+c]=tong/n; bien[r*CAM.COLS+c]=tb/n;
  }
  /* ngưỡng trượt chậm qua các khung hình — đây là chỗ gây nhảy loạn xạ nếu
     tính lại độc lập từng khung */
  const sx=Array.from(bien).sort((a,b)=>a-b);
  const ng=sx[Math.floor(sx.length*(CAM.NHAY/100))];
  camNguongEMA = camNguongEMA===null ? ng : camNguongEMA*0.8 + ng*0.2;

  const o=new Uint8Array(CAM.ROWS*CAM.COLS);
  for(let i=0;i<o.length;i++) o[i]=(sang[i]>120&&bien[i]>camNguongEMA)?1:0;

  const tham=new Int32Array(CAM.ROWS*CAM.COLS).fill(-1), vung=[];
  for(let i=0;i<o.length;i++){
    if(!o[i]||tham[i]>=0) continue;
    const id=vung.length, hang=[i]; tham[i]=id;
    let x0=CAM.COLS,y0=CAM.ROWS,x1=0,y1=0,dem=0;
    while(hang.length){
      const p=hang.pop(), pr=(p/CAM.COLS)|0, pc=p%CAM.COLS; dem++;
      if(pc<x0)x0=pc; if(pc>x1)x1=pc; if(pr<y0)y0=pr; if(pr>y1)y1=pr;
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        const nr=pr+dr,nc=pc+dc;
        if(nr<0||nc<0||nr>=CAM.ROWS||nc>=CAM.COLS) continue;
        const q=nr*CAM.COLS+nc; if(o[q]&&tham[q]<0){tham[q]=id;hang.push(q);} } }
    vung.push({x0,y0,x1,y1,dem});
  }
  /* Ô ngày và bảng thành phần đều là "vùng sáng nhiều đốm tối". Bảng thành phần
     to hơn nên luôn thắng nếu chỉ xếp theo kích thước — đó là lý do OCR trả về
     nguyên bảng thành phần. Ô date code luôn THẤP: 1-2 dòng chữ, tối đa ~5/30 ô
     lưới. Chặn bằng chiều cao và diện tích, không bằng thứ hạng. */
  const CAO_TOI_DA = 6;                       // trên 6/30 hàng lưới -> không phải ô ngày
  const O_TOI_DA   = ROWS_COLS_MAX;           // chặn khối chữ lớn
  return vung.filter(z=>{const w=z.x1-z.x0+1,h=z.y1-z.y0+1;
    return z.dem>=4 && z.dem<=O_TOI_DA && h<=CAO_TOI_DA && w/h>1.8 && w/h<16;});
}

/* ---- bám khung cũ thay vì luôn lấy vùng to nhất ---- */
/* Điểm chọn: dáng càng giống DÒNG CHỮ (dài và thấp) càng tốt, không phải càng to
   càng tốt. Đây là chỗ trước đây chọn nhầm bảng thành phần. */
function diemDang(z){
  const w=z.x1-z.x0+1, h=z.y1-z.y0+1;
  return (w/h) / h;          // dài/thấp -> điểm cao; càng cao càng bị phạt
}
function camChon(ds){
  if(!ds.length) return null;
  if(!camKhung) return ds.sort((a,b)=>diemDang(b)-diemDang(a))[0];
  const cx=(camKhung.x0+camKhung.x1)/2, cy=(camKhung.y0+camKhung.y1)/2;
  let tot=null, diem=1e9;
  ds.forEach(z=>{
    const zx=(z.x0+z.x1)/2, zy=(z.y0+z.y1)/2;
    const kc=Math.hypot(zx-cx,zy-cy) - diemDang(z)*6;   // gần khung cũ + đúng dáng dòng chữ
    if(kc<diem){diem=kc;tot=z;}
  });
  return tot;
}

function camVong(){
  camRAF=requestAnimationFrame(camVong);
  const v=document.getElementById('camv');
  if(!v||!camStream||!v.videoWidth) return;

  const t=performance.now();
  if(t-camLanCuoi < 1000/CAM.MOI_GIAY) { camVe(); return; }
  camLanCuoi=t;

  const moi=camChon(camDoVung());
  if(moi){
    camMat=0; camDem++;
    if(!camKhung) camKhung={x0:moi.x0,y0:moi.y0,x1:moi.x1,y1:moi.y1};
    else{
      const a=CAM.LAM_MUOT;
      camKhung.x0+=(moi.x0-camKhung.x0)*a; camKhung.y0+=(moi.y0-camKhung.y0)*a;
      camKhung.x1+=(moi.x1-camKhung.x1)*a; camKhung.y1+=(moi.y1-camKhung.y1)*a;
    }
  }else{
    camMat++; camDem=0;
    if(camMat>CAM.GIU_KHUNG) camKhung=null;
  }
  camVe();
  const tt=document.getElementById('camtt');
  if(tt) tt.textContent = (camKhung&&camDem>=CAM.CAN_LIEN)
    ? 'thấy vùng ngày — bấm Chụp và đọc'
    : 'đưa máy lại gần ô in ngày';
}

function camVe(){
  const v=document.getElementById('camv'), ve=document.getElementById('camve');
  if(!v||!ve) return;
  if(ve.width!==v.clientWidth){ve.width=v.clientWidth;ve.height=v.clientHeight;}
  const ctx=ve.getContext('2d');
  ctx.clearRect(0,0,ve.width,ve.height);
  if(!camKhung||camDem<CAM.CAN_LIEN) return;
  const sx=ve.width/CAM.COLS, sy=ve.height/CAM.ROWS;
  const x=camKhung.x0*sx, y=camKhung.y0*sy;
  const w=(camKhung.x1-camKhung.x0+1)*sx, h=(camKhung.y1-camKhung.y0+1)*sy;
  ctx.strokeStyle='#4ADE9B'; ctx.lineWidth=3; ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='rgba(74,222,155,.10)'; ctx.fillRect(x,y,w,h);
}

/* ---- chụp: cắt từ ảnh GỐC, chỉ phóng to ---- */
/* Cắt theo khung xanh khi thấy được, gửi cả ảnh khi không thấy.
   Đo trên ảnh thật của MMB: gửi cả ảnh thì OCR đọc được date trên THÙNG
   (chữ to, nền giấy) nhưng bỏ qua date trên GÓI (chữ phun nhỏ, nền bóng) —
   nó chỉ trả về bảng thành phần in offset. Cắt vùng rồi phóng to là cách
   duy nhất để chữ phun đủ lớn cho OCR. Không thấy khung thì vẫn gửi cả ảnh,
   và nếu tách được 0 ô thì tự gửi lại lần hai bằng ảnh nguyên tấm. */
function camCat(){
  const v=document.getElementById('camv');
  const c=document.createElement('canvas');
  c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  if(!camKhung||camDem<CAM.CAN_LIEN) return {canvas:c,cao:null,cat:false};

  const pad=0.25;
  const w=(camKhung.x1-camKhung.x0+1)/CAM.COLS, h=(camKhung.y1-camKhung.y0+1)/CAM.ROWS;
  const px=w*pad*.5, py=h*pad;
  const x0=Math.max(0,(camKhung.x0/CAM.COLS-px))*c.width;
  const y0=Math.max(0,(camKhung.y0/CAM.ROWS-py))*c.height;
  const x1=Math.min(1,(camKhung.x1+1)/CAM.COLS+px)*c.width;
  const y1=Math.min(1,(camKhung.y1+1)/CAM.ROWS+py)*c.height;
  const cw=Math.round(x1-x0), chh=Math.round(y1-y0);
  const he=Math.min(6,Math.max(2,Math.round(320/Math.max(1,chh))));
  const cc=document.createElement('canvas');
  cc.width=cw*he; cc.height=chh*he;
  const g=cc.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  g.drawImage(c,x0,y0,cw,chh,0,0,cc.width,cc.height);
  return {canvas:cc,cao:chh,cat:true};
}

/* ============================================================
   BÓC CHỮ — chạy trên máy, thuần code. Khối này từng bị mất một lần
   trong quá trình vá; nếu thiếu nó thì app vẫn chạy, vẫn không báo lỗi,
   nhưng không bao giờ điền được ô nào. Có TU_KIEM ở cuối file để bắt.
   ============================================================ */

/* Nhãn bị OCR đọc lệch là chuyện thường xuyên: tài liệu bàn giao ghi
   HSD -> HEB, HSD -> RSD; ảnh thùng ly thực tế cho NSX -> NEX, HSD -> HED.
   Đây KHÔNG phải so mờ — danh sách đóng, tra tường minh, và chỉ tra biến thể
   của ĐÚNG nhãn master khai cho mã đó, nên NSX không bao giờ lẫn sang HSD. */
var BIEN_THE_NHAN = {
  'NSX': ['NSX','N5X','NEX','NSK','MSX','N9X','NSY','H5X','NSXX'],
  'MFG': ['MFG','MEG','MFC','MTG','MF6'],
  'HSD': ['HSD','HED','HEB','RSD','H5D','HSO','H9D','HSB','H5O'],
  'EXP': ['EXP','EPX','FXP','EXR'],
  'BBF': ['BBF','B8F','BBE','8BF'],
  'BBD': ['BBD','B8D','BBO'],
  'LOT': ['LOT','L0T','LDT'],
  'USE BY': ['USE BY','USEBY'],
  'BEST BEFORE': ['BEST BEFORE','BESTBEFORE'],
  'BEST IF USED BY': ['BEST IF USED BY','BESTIFUSEDBY']
};
function bienTheCua(nhan){
  var N=String(nhan||'').toUpperCase().trim();
  return BIEN_THE_NHAN[N] || [N];
}

function camGomChu(dong){
  return (dong||[]).join(' ').replace(/\s+/g,' ').trim();
}

/* Cắt theo VỊ TRÍ từng nhãn trong cả chuỗi, không theo "dòng nào bắt đầu bằng".
   Lý do: một dòng OCR có khi chứa cả hai nhãn —
   "NSX 06 04 26 C1 07:08 HSD 06 12 26 HY". */
function camCatTheoNhan(chuoi, nhanCanTim){
  var S=chuoi.toUpperCase(), moc=[];
  (nhanCanTim||[]).forEach(function(nh){
    if(!nh) return;
    bienTheCua(nh).forEach(function(bt){
      var N=bt.toUpperCase(), i=0;
      while((i=S.indexOf(N,i))>=0){
        var truoc = i===0 ? ' ' : S[i-1];
        if(!/[A-Z0-9]/.test(truoc)) moc.push({nhan:nh, doc:bt, vi:i});
        i+=N.length;
      }
    });
  });
  moc.sort(function(a,b){return a.vi-b.vi;});
  return moc.map(function(m,k){
    return { nhan:m.nhan, doc:m.doc,
      doan: chuoi.slice(m.vi, k+1<moc.length ? moc[k+1].vi : chuoi.length).trim() };
  });
}

/* Tìm cụm ngày NGẮN NHẤT đọc được theo đúng mẫu master khai.
   Bỏ đuôi giờ và mã line ("C1 07:08", "33 I") vì readDate khớp trọn chuỗi.
   Không đọc được thì trả null — KHÔNG đoán. */
function camCumNgay(doan, fmt){
  var sl=stripLabel(doan);
  if(!sl.found){
    var up=String(doan).toUpperCase().trim();
    for(var nh in BIEN_THE_NHAN){
      var ds=BIEN_THE_NHAN[nh];
      for(var j=0;j<ds.length;j++){
        if(up.indexOf(ds[j])===0){
          sl={found:nh, rest:up.slice(ds[j].length).replace(/^[:\s.]+/,'')};
          break;
        }
      }
      if(sl.found) break;
    }
  }
  var t=String(sl.rest).trim().split(/\s+/).filter(Boolean);
  if(!t.length) return null;
  for(var n=1; n<=Math.min(4,t.length); n++){
    var cum=t.slice(0,n).join(' ');
    if(readDate(cum, fmt, true)) return (sl.found ? sl.found+' ' : '')+cum;
  }
  return null;
}

function camDienVaoO(dong){
  var canDien=camSegs.filter(function(x){return x.label;}).length;
  MAY_DIEN={};
  if(CHE_DO==='MU') return {daDien:0, soNhan:canDien, mu:true, soCap:0};

  var chuoi=camGomChu(dong);
  var nhan=camSegs.map(function(x){return x.label;}).filter(Boolean);
  var phan=camCatTheoNhan(chuoi, nhan);
  var daDien=0;

  camSegs.forEach(function(sg){
    var o=$('in'+sg.i); if(!o||!sg.label) return;
    var ung=phan.filter(function(p){
      return p.nhan.toUpperCase()===sg.label.toUpperCase(); });
    for(var i=0;i<ung.length;i++){
      var cum=camCumNgay(ung[i].doan, sg.fmt);
      if(cum){ o.value=cum; AUTOFILL[sg.i]=cum; MAY_DIEN[sg.i]=cum; daDien++;
               o.dispatchEvent(new Event('input')); break; }
    }
  });

  /* Mã máy: token 1-2 số + 1 ký tự, đứng SAU cụm ngày của dòng hạn dùng.
     Chấp nhận cả "13 I" lẫn "13I" — máy in để khoảng trắng không đều. */
  var om=$('inmay');
  if(om){
    var sgH=camSegs.filter(function(x){return x.kind==='EXPIRY'&&x.label;})[0];
    if(sgH){
      var ungH=phan.filter(function(p){
        return p.nhan.toUpperCase()===sgH.label.toUpperCase(); });
      for(var k=0;k<ungH.length;k++){
        var t=ungH[k].doan.toUpperCase().replace(/(\d)\s+([A-Z])(?![A-Z0-9])/g,'$1$2')
              .split(/\s+/).filter(Boolean);
        for(var j=t.length-1;j>=0;j--){
          var tk=t[j].replace(/[^A-Z0-9]/g,'');
          if(/^[0-9]{1,2}[A-Z]$/.test(tk) || /^[0-9]{2,3}$/.test(tk)){
            om.value=tk; AUTOFILL['may']=tk; MAY_DIEN['may']=tk;
            om.dispatchEvent(new Event('input')); break;
          }
        }
        if(om.value) break;
      }
    }
  }

  /* Đếm số cặp ngày trong ảnh. Từ 2 trở lên là ảnh nhiều gói -> loại khỏi tập train,
     vì nhãn chỉ mô tả một gói trong khi ảnh chứa nhiều. */
  var soCap=phan.filter(function(p){ return camCumNgay(p.doan,
      (camSegs.filter(function(x){return x.label&&x.label.toUpperCase()===p.nhan.toUpperCase();})[0]||{}).fmt || 'DDMMYY'
    ); }).length;

  return {daDien:daDien, soNhan:canDien, soCap:soCap};
}

/* Gửi ảnh lên trạm, nhận chuỗi đọc, điền vào ô. Trả về kết quả tách để
   camChup biết có cần thử lại bằng ảnh nguyên tấm không. */
function camGuiAnh(canvas, cao){
  var hop=document.getElementById('camdoc'), tt=document.getElementById('camtt');
  hop.style.display='block'; hop.textContent='Đang gửi ảnh…';
  return fetch(TRAM_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({act:'doc',
        anh_b64:canvas.toDataURL('image/jpeg',.92).split(',')[1],
        ma_item:(CUR&&CUR.item_code)||'', cao_vung_px:cao,
        nguoi_kiem:(($('who')&&$('who').value)||'').trim()})})
   .then(function(x){return x.json();})
   .then(function(r){
      if(!r||!r.ok) throw new Error((r&&r.loi)||'trạm không trả lời');
      LAST_OCR={id:r.id, dong:r.dong||[]};
      var kq=camDienVaoO(r.dong||[]);
      KQ_TACH=kq; SO_CAP=kq.soCap||0;

      var hopLD=document.getElementById('suahop');
      if(hopLD && kq.daDien<kq.soNhan && CHE_DO!=='MU') hopLD.style.display='block';

      T0_XACNHAN=Date.now();
      var xn=document.getElementById('xacnhan'), mu=document.getElementById('mucanh');
      if(CHE_DO==='MU'){
        mu.style.display='block';
        mu.innerHTML='<b>Lượt kiểm mù.</b> Máy đã đọc nhưng cố tình không hiện. '+
          'Gõ tay đúng chữ đang in trên bao. Lượt này dùng để đo máy đọc sai bao nhiêu '+
          '— gõ theo trí nhớ là làm hỏng số đo.';
        xn.style.display='none';
        hop.textContent='Lượt kiểm mù — gõ tay từ bao bì.';
      }else{
        mu.style.display='none';
        hop.textContent = kq.daDien===kq.soNhan
          ? 'Đã điền '+kq.daDien+'/'+kq.soNhan+' ô.'
          : 'Chỉ tách được '+kq.daDien+'/'+kq.soNhan+' ô — gõ tay ô còn thiếu.\n\n'+
            'Máy đọc được:\n'+(r.dong||[]).join('\n').slice(0,600);
        if(kq.daDien>0){
          document.getElementById('xn_may').textContent=
            camSegs.filter(function(x){return x.label;})
                   .map(function(x){ return (($('in'+x.i)||{}).value)||'—'; }).join('\n');
          xn.style.display='block';
        }
      }
      if(tt) tt.textContent='đọc xong — đối chiếu bao bì rồi xác nhận';
      return kq;
   })
   .catch(function(e){
      hop.textContent='Không đọc được: '+e.message+'\nGõ tay vào ô bên dưới như bình thường.';
      return null;
   });
}

/* ============================================================
   KHOANH VÙNG BẰNG TAY — người chọn, máy đọc đúng vùng đó.
   Bộ dò tự động chỉ còn là gợi ý: nó vẽ sẵn khung, người kéo lại nếu sai.
   Lý do bỏ nó khỏi đường đi chính: ô ngày và bảng thành phần cùng là
   "vùng sáng nhiều đốm tối", chỉnh ngưỡng bên này thì hỏng bên kia.
   ============================================================ */
var ANH_GOC=null;                        // canvas ảnh gốc, độ phân giải đầy đủ
var KHUNG={x:0.20,y:0.40,w:0.60,h:0.16}; // theo TỈ LỆ 0-1 của ảnh gốc
var dangKeo=false, keoTu=null;

function moKhoanh(canvasGoc, khungGoiY){
  ANH_GOC=canvasGoc;
  KHUNG = khungGoiY || {x:0.20,y:0.40,w:0.60,h:0.16};
  var k=document.getElementById('khoanh'); if(k) k.style.display='block';
  var t=document.getElementById('camtt'); if(t) t.textContent='khoanh vùng rồi bấm Đọc';
  veKhoanh();
}
function dongKhoanh(){
  var k=document.getElementById('khoanh'); if(k) k.style.display='none';
}

function veKhoanh(){
  var cv=document.getElementById('khoanhcv'); if(!cv||!ANH_GOC) return;
  var rong=cv.clientWidth||360, ti=rong/ANH_GOC.width;
  cv.width=rong; cv.height=Math.round(ANH_GOC.height*ti);
  var g=cv.getContext('2d');
  g.drawImage(ANH_GOC,0,0,cv.width,cv.height);
  var x=KHUNG.x*cv.width, y=KHUNG.y*cv.height,
      w=KHUNG.w*cv.width, h=KHUNG.h*cv.height;
  g.fillStyle='rgba(0,0,0,.45)';
  g.fillRect(0,0,cv.width,y);
  g.fillRect(0,y+h,cv.width,cv.height-y-h);
  g.fillRect(0,y,x,h);
  g.fillRect(x+w,y,cv.width-x-w,h);
  g.strokeStyle='#4ADE9B'; g.lineWidth=3; g.strokeRect(x,y,w,h);
  g.fillStyle='#4ADE9B';
  [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(function(p){ g.fillRect(p[0]-5,p[1]-5,10,10); });
}

function toaDo(e,cv){
  var r=cv.getBoundingClientRect();
  var t=(e.touches&&e.touches[0])||e;
  return {x:(t.clientX-r.left)/r.width, y:(t.clientY-r.top)/r.height};
}

function ganSuKienKhoanh(){
  var cv=document.getElementById('khoanhcv'); if(!cv) return;
  function bd(e){ if(!ANH_GOC) return; e.preventDefault(); dangKeo=true;
    keoTu=toaDo(e,cv); KHUNG={x:keoTu.x,y:keoTu.y,w:0,h:0}; veKhoanh(); }
  function bm(e){ if(!dangKeo) return; e.preventDefault();
    var p=toaDo(e,cv);
    KHUNG={ x:Math.max(0,Math.min(keoTu.x,p.x)), y:Math.max(0,Math.min(keoTu.y,p.y)),
            w:Math.min(1,Math.abs(p.x-keoTu.x)), h:Math.min(1,Math.abs(p.y-keoTu.y)) };
    veKhoanh(); }
  function be(){ if(!dangKeo) return; dangKeo=false;
    /* kéo hụt vài pixel coi như lỡ tay — trả về khung mặc định, không gửi vùng rỗng */
    if(KHUNG.w<0.04||KHUNG.h<0.02) KHUNG={x:0.20,y:0.40,w:0.60,h:0.16};
    veKhoanh(); }
  cv.addEventListener('touchstart',bd,{passive:false});
  cv.addEventListener('touchmove',bm,{passive:false});
  cv.addEventListener('touchend',be);
  cv.addEventListener('mousedown',bd);
  window.addEventListener('mousemove',bm);
  window.addEventListener('mouseup',be);
  window.addEventListener('resize',veKhoanh);
}

/** Cắt theo KHUNG từ ảnh GỐC (lỗi #3), chỉ phóng to, không thu nhỏ (lỗi #5). */
function catTheoKhung(){
  var x=Math.max(0,Math.round(KHUNG.x*ANH_GOC.width));
  var y=Math.max(0,Math.round(KHUNG.y*ANH_GOC.height));
  var w=Math.max(8,Math.min(ANH_GOC.width-x,  Math.round(KHUNG.w*ANH_GOC.width)));
  var h=Math.max(8,Math.min(ANH_GOC.height-y, Math.round(KHUNG.h*ANH_GOC.height)));
  /* Chỉ phóng to khi vùng THẤP (chữ nhỏ). Vùng cao là khoanh rộng hoặc cả ảnh —
     phóng to chỉ làm file nặng, mạng xưởng ì, mà không thêm chi tiết nào. */
  var he=Math.max(1,Math.min(6,Math.round(320/h)));
  var c=document.createElement('canvas');
  c.width=w*he; c.height=h*he;
  var g=c.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  g.drawImage(ANH_GOC,x,y,w,h,0,0,c.width,c.height);
  return {canvas:c, cao:h};
}

/* Chụp xong KHÔNG gửi ngay. Đóng băng ảnh, mở màn khoanh vùng để QC tự chọn.
   Khung tự động được vẽ sẵn làm gợi ý — đúng thì bấm Đọc, sai thì kéo lại. */
async function camChup(){
  CHE_DO = laLuotMu() ? 'MU' : 'THUONG';
  const v=document.getElementById('camv');
  const c=document.createElement('canvas');
  c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);

  let goiY=null;
  if(camKhung&&camDem>=CAM.CAN_LIEN){
    const pad=0.25;
    const w=(camKhung.x1-camKhung.x0+1)/CAM.COLS, h=(camKhung.y1-camKhung.y0+1)/CAM.ROWS;
    goiY={ x:Math.max(0,camKhung.x0/CAM.COLS - w*pad*.5),
           y:Math.max(0,camKhung.y0/CAM.ROWS - h*pad),
           w:Math.min(1,w*(1+pad)), h:Math.min(1,h*(1+pad*2)) };
  }
  moKhoanh(c, goiY);
}

/* ============================================================
   GẮN SỰ KIỆN THEO UỶ QUYỀN.
   Trước đây gắn onclick trực tiếp lên từng nút bên trong camKhoiDong.
   Cách đó phụ thuộc vào việc nút đã tồn tại đúng lúc hàm chạy — mà thẻ nút
   nằm trong khối giao diện được dựng lại mỗi lần chọn sản phẩm. Lệch một nhịp
   là nút chết câm, không báo gì. Uỷ quyền ở cấp document thì không còn phụ
   thuộc thứ tự dựng nữa.
   ============================================================ */
document.addEventListener('click', function(ev){
  var el = ev.target && ev.target.closest ? ev.target.closest('button') : null;
  if(!el || !el.id) return;
  try{
    if(el.id==='kh_doc'){
      ev.preventDefault();
      if(!ANH_GOC) return baoLoi('Chưa có ảnh để đọc.');
      var a=catTheoKhung(); el.disabled=true; camCaoGoc=a.cao;
      camGuiAnh(a.canvas, a.cao).then(function(kq){
        el.disabled=false;
        if(kq && kq.daDien===0){
          document.getElementById('khoanhtt').textContent=
            'Vùng vừa chọn không ra ngày. Kéo lại sát ô in ngày hơn, hoặc bấm Đọc cả ảnh.';
        } else dongKhoanh();
      });
    }
    else if(el.id==='kh_ca'){
      ev.preventDefault();
      if(!ANH_GOC) return baoLoi('Chưa có ảnh để đọc.');
      el.disabled=true;
      camGuiAnh(ANH_GOC, null).then(function(){ el.disabled=false; dongKhoanh(); });
    }
    else if(el.id==='kh_lai'){ ev.preventDefault(); dongKhoanh(); }
    else if(el.id==='xn_dung'){
      ev.preventDefault();
      GIAY_XN=(Date.now()-T0_XACNHAN)/1000;
      document.getElementById('xacnhan').style.display='none';
      var r=document.getElementById('run'); if(r) r.click();
    }
    else if(el.id==='xn_sai'){
      ev.preventDefault();
      GIAY_XN=(Date.now()-T0_XACNHAN)/1000;
      document.getElementById('xacnhan').style.display='none';
      var h=document.getElementById('suahop'); if(h) h.style.display='block';
      var o=$('in'+((camSegs[0]||{i:1}).i)); if(o){ o.focus(); }
    }
  }catch(e){ baoLoi(el.id+': '+e.message); }
});

/* Lỗi phải NHÌN THẤY. Trước đây nút chết câm vì lỗi rơi vào console mà
   không ai mở console trên điện thoại. */
function baoLoi(t){
  var d=document.getElementById('bangloi');
  if(!d){
    d=document.createElement('div'); d.id='bangloi';
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;'+
      'background:#7A2118;color:#FFE2DC;padding:10px 12px;font:600 13px system-ui';
    d.onclick=function(){ d.remove(); };
    document.body.appendChild(d);
  }
  d.textContent='LỖI — '+t+'  (chạm để đóng)';
}
window.addEventListener('error', function(e){ baoLoi(e.message); });
window.addEventListener('unhandledrejection', function(e){
  baoLoi('lời hứa hỏng: '+((e.reason&&e.reason.message)||e.reason));
});

function camChonAnh(file){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas');
      const ti=Math.min(1, 2000/Math.max(im.width,im.height));   // chỉ thu nhỏ ảnh quá lớn
      c.width=Math.round(im.width*ti); c.height=Math.round(im.height*ti);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      moKhoanh(c, null);
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
</script>
