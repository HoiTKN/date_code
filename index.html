<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiểm date code hàng xuất khẩu</title>
<style>
:root{
  --ink:#14181C; --steel:#68757C; --hair:#C7CFCE; --bg:#E4E8E7; --surface:#FFFFFF;
  --pass:#0E6F52; --fail:#A81D26; --warnbg:#F6DE9A; --band:#1B2126; --focus:#0B6BB5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 90px}

header{background:var(--band);color:#EDF1F0;padding:14px 14px 12px}
header .inner{max-width:560px;margin:0 auto}
header h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.srcline{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11.5px;color:#93A2A8}
.dot{width:7px;height:7px;border-radius:50%;background:#4E5D64;flex:none}
.dot.ok{background:#3FA07C} .dot.warn{background:#E8B10A}
.srcline button{margin-left:auto;background:none;border:1px solid #3A464C;color:#C6D2D6;
  padding:5px 10px;border-radius:3px;font-size:11.5px;cursor:pointer;font-family:inherit}
.who{display:flex;gap:8px;align-items:center;margin-top:10px}
.who input{flex:1;background:#141A1E;border:1px solid #3A464C;color:#E9F1F0;padding:8px 10px;
  border-radius:3px;font-size:13px;font-family:inherit}
.who input::placeholder{color:#6B7B82}
.who label{font-size:11px;color:#93A2A8;letter-spacing:.08em;text-transform:uppercase;flex:none;margin:0}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--hair);
  display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;padding:13px 4px 12px;font-family:inherit;font-size:12.5px;
  font-weight:600;color:var(--steel);cursor:pointer;border-top:2px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--band)}
nav .badge{display:inline-block;background:var(--fail);color:#fff;border-radius:9px;
  padding:0 5px;font-size:10.5px;margin-left:4px;vertical-align:1px}

.card{background:var(--surface);border:1px solid var(--hair);border-radius:4px;padding:14px;margin:12px 0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:8px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.hint{font-size:12px;color:var(--steel);margin-top:5px;line-height:1.45}
input,select,textarea{width:100%;padding:12px 11px;border:1px solid #AEB8B7;border-radius:3px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
input.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}
.field+.field{margin-top:13px}

#results{max-height:300px;overflow:auto;margin-top:8px;border:1px solid var(--hair);border-radius:3px}
.hit{padding:10px 11px;border-bottom:1px solid #EDF0EF;cursor:pointer}
.hit:last-child{border-bottom:none}
.hit:hover,.hit:focus{background:#F0F4F3;outline:none}
.hit .c{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700}
.hit .n{font-size:12.5px;color:var(--steel);margin-top:2px}
.listhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);
  padding:8px 11px;background:#F2F5F4;border-bottom:1px solid var(--hair);font-weight:700}

.chosen{border-left:3px solid var(--band)}
.chosen .code{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700}
.chosen .name{font-size:13.5px;color:#3E4A50;margin-top:3px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:2px;background:#EAEEED;color:#38444A}
.tag.amber{background:var(--warnbg);color:#5A3B00}
.strip{background:var(--band);border-radius:3px;padding:11px 12px;margin-top:11px}
.strip .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7E8E95;margin-bottom:6px}
.strip .row{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:#E9F4F0;
  letter-spacing:.1em;padding:2px 0}
.strip .row .k{color:#7E8E95;font-size:11.5px;letter-spacing:.06em;margin-right:8px}

.verdict{border-radius:4px;overflow:hidden;margin:12px 0}
.verdict .head{padding:16px 14px;color:#fff}
.verdict .head b{display:block;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.verdict .head span{display:block;font-size:12.5px;opacity:.88;margin-top:4px}
.v-pass .head{background:var(--pass)} .v-fail .head{background:var(--fail)}
.v-warn .head{background:var(--warnbg);color:#3D2800} .v-warn .head span{opacity:.75}
.verdict .body{background:#fff;border:1px solid var(--hair);border-top:none;padding:4px 0}
.line{display:flex;gap:10px;padding:11px 13px;border-bottom:1px solid #EEF1F0;align-items:flex-start}
.line:last-child{border-bottom:none}
.line .m{flex:none;width:17px;height:17px;border-radius:50%;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.m.ok{background:var(--pass)} .m.no{background:var(--fail)} .m.wa{background:#C99400}
.line .t{font-size:13.5px;line-height:1.45}
.line .t .d{color:var(--steel);font-size:12.5px;margin-top:3px;display:block}
.saved{background:#F2F5F4;border:1px solid var(--hair);border-top:none;border-radius:0 0 4px 4px;padding:11px 13px}
.saved .s{font-size:12px;color:var(--steel)}
.row2{display:flex;gap:8px;margin-top:9px}
.row2 button{flex:1}

button.go{width:100%;padding:15px;background:var(--band);color:#fff;border:none;border-radius:3px;
  font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit}
button.go:active{background:#2A343A}
button.ghost{width:100%;padding:11px;background:#fff;border:1px solid var(--hair);border-radius:3px;
  font-size:13px;cursor:pointer;font-family:inherit;color:#38444A}
.empty{text-align:center;color:var(--steel);font-size:13.5px;padding:26px 14px;line-height:1.6}

.log{background:#fff;border:1px solid var(--hair);border-radius:4px;overflow:hidden}
.logrow{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid #EEF1F0;align-items:flex-start}
.logrow:last-child{border-bottom:none}
.pill{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 6px;border-radius:2px;color:#fff;margin-top:2px}
.p-pass{background:var(--pass)} .p-fail{background:var(--fail)} .p-warn{background:#C99400}
.logrow .b{font-size:13px;line-height:1.4}
.logrow .b .s{display:block;color:var(--steel);font-size:11.5px;margin-top:2px}
.hidden{display:none}

/* ===== KHỐI CAMERA — thêm ===== */
#camboc{position:relative;width:100%;background:#000;overflow:hidden;border-radius:10px}
#camboc video{width:100%;display:block}
#camve{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.camhang{display:flex;gap:8px;margin-top:10px}
.camhang button{flex:1}
#camtt{font-size:12px;color:#93A2A8;margin-top:6px;font-variant-numeric:tabular-nums}
#camdoc{margin-top:10px;padding:10px;border-radius:8px;background:rgba(255,255,255,.04);
        font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;display:none}
.camnho{font-size:12px;color:#93A2A8;margin-top:6px}
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>Kiểm date code hàng xuất khẩu</h1>
    <div class="srcline">
      <span class="dot" id="dot"></span><span id="srctxt">Đang tải master…</span>
      <button id="refresh" type="button">Cập nhật master</button>
    </div>
    <div class="who">
      <label for="site">Nhà máy</label>
      <select id="site" style="flex:1;padding:10px;border-radius:8px"></select>
    </div>
    <div class="who">
      <label for="tram">Trạm đọc ảnh</label>
      <input id="tram" placeholder="Dán link .../exec của Apps Script" autocomplete="off" spellcheck="false">
    </div>
    <div class="who">
      <label for="who">Người kiểm</label>
      <input id="who" placeholder="Họ tên hoặc mã nhân viên" autocomplete="name">
    </div>
  </div>
</header>

<div class="wrap">
  <section id="tab-check">
    <div class="card">
      <div class="eyebrow">Bước 1 · Chọn sản phẩm</div>
      <input id="q" placeholder="Gõ mã item, tên, hoặc thị trường" autocomplete="off" spellcheck="false">
      <div id="results"></div>
    </div>
    <div id="item"></div>
    <div id="verdict"></div>
  </section>

  <section id="tab-log" class="hidden">
    <div class="card">
      <div class="eyebrow">Sổ kiểm trên máy này</div>
      <div class="hint" id="logsum"></div>
      <div class="row2">
        <button class="ghost" id="exp" type="button">Tải sổ về (.csv)</button>
        <button class="ghost" id="cp" type="button">Sao chép sổ</button>
      </div>
      <button class="ghost" id="clr" type="button" style="margin-top:8px">Xóa sổ</button>
      <div class="hint">Sổ nằm trong trình duyệt của máy này. Xóa lịch sử trình duyệt là mất.
        Cuối ca tải file .csv rồi đẩy lên thư mục QA của site.</div>
    </div>
    <div id="loglist"></div>
  </section>

  <div class="card" style="border:none;background:none;padding:0">
    <input type="file" id="file" accept=".csv,text/csv" hidden>
    <button class="ghost" type="button" id="pick">Nạp master từ file trong máy (.csv)</button>
  </div>
</div>

<nav>
  <button id="nav1" class="on" type="button">Kiểm</button>
  <button id="nav2" type="button">Sổ kiểm <span class="badge hidden" id="badge">0</span></button>
</nav>

let MASTER=[];

function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[]; let f='',row=[],q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else{ if(c==='"')q=true;
      else if(c===','){row.push(f);f='';}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
      else if(c!=='\r')f+=c; }
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length>1&&r[0]).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||'').trim());return o;});
}
/* Master dùng schema chuẩn (ma_item, dong1..4_*). Hàm check() vốn đọc
   item_code/segN_*. Chuyển ở đây thay vì sửa hàm kết luận đã chạy đúng. */
function chuanHoaMaster(rows){
  if(!rows.length) return rows;
  if(rows[0].item_code!==undefined) return rows;      // bảng đời cũ, để nguyên
  return rows.map(r=>{
    const o={
      item_code:r.ma_item, pkg_code:'', ten_san_pham:r.ten_san_pham,
      tu_khoa:r.tu_khoa||'', cap_bao_bi:r.cap_bao_bi||'',
      site_ap_dung:r.site_ap_dung||'', thi_truong:r.thi_truong||'',
      hsd_thang:r.so_thang_ap_dung||'', nguon_hsd:r.nguon_hsd||'',
      nguon_form:r.nguon_form||'', ghi_chu_in:r.ghi_chu_in||'',
      ghi_chu_tctp:'', canh_bao:r.canh_bao||'',
      trang_thai:(r.trang_thai_duyet==='DA_DUYET'&&!r.canh_bao)?'SAN_SANG':'THIEU_DU_LIEU'
    };
    for(let i=1;i<=4;i++){
      o['seg'+i+'_loai']  = r['dong'+i+'_loai']||'';
      o['seg'+i+'_nhan']  = r['dong'+i+'_nhan']||'';
      o['seg'+i+'_format']= r['dong'+i+'_mau_ngay']||'';
      o['seg'+i+'_them']  = r['dong'+i+'_thanh_phan']||'';
    }
    return o;
  });
}

function toCSV(rows,cols){
  const q=v=>{v=(v??'')+''; return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return '\uFEFF'+cols.join(',')+'\n'+rows.map(r=>cols.map(c=>q(r[c])).join(',')).join('\n');
}
async function loadMaster(){
  const dot=$('dot'), txt=$('srctxt');
  let loiTram='';
  const nhan=t=>{ txt.textContent=t+'  ·  '+BAN_DUNG; };
  nhan('Đang gọi trạm…');

  /* 1. Google Sheet qua trạm — nguồn thật. Có hạn giờ 20 giây: mạng xưởng
        chập chờn thì phải rơi xuống bản dự phòng, không được treo màn hình. */
  if(TRAM_URL){
    try{
      const bo=new AbortController();
      const hen=setTimeout(()=>bo.abort(),20000);
      let res;
      try{
        res=await fetch(TRAM_URL,{method:'POST',redirect:'follow',cache:'no-store',
          signal:bo.signal, headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({act:'master'})});
      } finally { clearTimeout(hen); }

      const chu=await res.text();
      let j=null;
      try{ j=JSON.parse(chu); }
      catch(_){
        /* Trạm trả HTML = deployment chưa có mã mới, hoặc quyền truy cập
           đang bắt đăng nhập nên Google trả về trang login. */
        throw new Error(chu.indexOf('<')===0
          ? 'trạm trả HTML chứ không phải JSON — deployment chưa cập nhật hoặc chưa mở quyền'
          : 'trạm trả nội dung lạ');
      }
      if(!j.ok) throw new Error(j.loi||'trạm báo lỗi');
      if(!j.csv) throw new Error('trạm không trả bảng master');

      const m=chuanHoaMaster(parseCSV(j.csv));
      if(!m.length||!m[0].item_code) throw new Error('bảng master sai cột');
      MASTER=m; dot.className='dot ok';
      nhan(m.length+' item · Google Sheet'+(j.sua_luc?' · sửa '+j.sua_luc:''));
      buildDupIndex(); render(); return;
    }catch(e){
      loiTram=(e&&e.name==='AbortError')?'trạm không trả lời sau 20 giây':(e.message||'không gọi được trạm');
    }
  }

  /* 2. file CSV đặt cạnh index.html */
  try{
    const res=await fetch(MASTER_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw 0;
    const m=chuanHoaMaster(parseCSV(await res.text()));
    if(!m.length||!m[0].item_code) throw 0;
    MASTER=m; dot.className='dot ok'; nhan(m.length+' item · master_datecode.csv');
  }catch(e){
    /* 3. bản nhúng — chỉ để app không chết, KHÔNG phải nguồn thật */
    MASTER=chuanHoaMaster(parseCSV(EMBEDDED_CSV)); dot.className='dot warn';
    nhan(MASTER.length+' item · bản nhúng'+(loiTram?' · TRẠM LỖI: '+loiTram:''));
  }
  buildDupIndex(); render();
}

/* item trùng tên gần giống → cảnh báo chọn nhầm quy cách */
let DUP={};
function nkey(s){ return s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'').slice(0,30); }
function buildDupIndex(){
  DUP={}; const c={};
  MASTER.forEach(r=>{const k=nkey(r.ten_san_pham); (c[k]=c[k]||[]).push(r.item_code);});
  Object.values(c).forEach(v=>{ if(v.length>1) v.forEach(code=>DUP[code]=v.filter(x=>x!==code)); });
}

/* ===== 3. ENGINE ===== */
const MMM=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const TOKRE=/MMM|YYYY|YY|MM|DD/g;
function splitFmt(fmt){const p=[];let last=0,m;TOKRE.lastIndex=0;
  while((m=TOKRE.exec(fmt))!==null){ if(m.index>last)p.push({sep:fmt.slice(last,m.index)});
    p.push({tok:m[0]}); last=m.index+m[0].length; }
  if(last<fmt.length)p.push({sep:fmt.slice(last)}); return p;}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function buildRe(fmt,loose){const parts=splitFmt(fmt);let re='^',order=[],prevTok=false;
  for(const p of parts){
    if(p.sep!==undefined){const s=p.sep.trim();
      if(loose)re+='[ ./\\-]*'; else if(s==='')re+='\\s*'; else re+='\\s*'+esc(s)+'\\s*';
      prevTok=false;}
    else{ if(loose&&prevTok)re+='[ ./\\-]*';
      order.push(p.tok);
      re += p.tok==='MMM'?'([A-Z]{3})':p.tok==='YYYY'?'(\\d{4})':'(\\d{2})';
      prevTok=true;}
  }
  return {re:new RegExp(re+'$'),order};}
function readDate(str,fmt,loose){
  const {re,order}=buildRe(fmt,loose);
  const m=String(str).trim().toUpperCase().match(re); if(!m)return null;
  let d=null,mo=null,y=null;
  order.forEach((t,i)=>{const v=m[i+1];
    if(t==='DD')d=+v; else if(t==='MM')mo=+v;
    else if(t==='MMM')mo=MMM.indexOf(v)+1||null;
    else if(t==='YYYY')y=+v; else if(t==='YY')y=2000+ +v;});
  if(!d||!mo||!y||mo<1||mo>12||d<1||d>31)return null;
  const dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCDate()!==d||dt.getUTCMonth()!==mo-1)return null;
  return dt;}
function swapDM(fmt){ if(!/DD/.test(fmt)||!/MM/.test(fmt)||/MMM/.test(fmt))return null;
  const a=fmt.replace(/DD/,'\u0001').replace(/MM/,'DD').replace(/\u0001/,'MM');
  return a===fmt?null:a;}
function addMonths(dt,n){const y=dt.getUTCFullYear(),m=dt.getUTCMonth(),d=dt.getUTCDate();
  const last=new Date(Date.UTC(y,m+n+1,0)).getUTCDate();
  return new Date(Date.UTC(y,m+n,Math.min(d,last)));}
const fmtVN=dt=>String(dt.getUTCDate()).padStart(2,'0')+'/'+String(dt.getUTCMonth()+1).padStart(2,'0')+'/'+dt.getUTCFullYear();
const dayDiff=(a,b)=>Math.round((a-b)/86400000);
const LABELS=['BEST IF USED BY','BEST BEFORE','USE BY','BBF','BBD','EXP','MFG','NSX','HSD','LOT NO','LOT','PKD'];
function stripLabel(s){let t=String(s).trim().toUpperCase().replace(/^[:\s]+/,'');
  for(const L of LABELS) if(t.startsWith(L)) return {found:L,rest:t.slice(L.length).replace(/^[:\s.]+/,'')};
  return {found:null,rest:t};}

function segments(it){const o=[];for(let i=1;i<=4;i++){const k=it['seg'+i+'_loai'],f=it['seg'+i+'_format'];
  if(k&&f)o.push({i,kind:k,label:it['seg'+i+'_nhan'],fmt:f,them:it['seg'+i+'_them']||''});}return o;}

function check(it,nsx,inputs){
  const lines=[];let fail=false,warn=false;
  const months=parseInt(it.hsd_thang,10);
  for(const s of segments(it)){
    const raw=(inputs[s.i]||'').trim();
    const title=(s.kind==='EXPIRY'?'Hạn sử dụng':s.kind==='PROD'?'Ngày sản xuất in trên bao':'Lot')+(s.label?' ('+s.label+')':'');
    if(!raw){lines.push({m:'wa',t:title,d:'Chưa nhập — không kết luận được ô này.'});warn=true;continue;}
    const {found,rest}=stripLabel(raw);
    if(s.label&&found&&found!==s.label){
      lines.push({m:'no',t:title,d:'In nhãn "'+found+'" nhưng tiêu chuẩn là "'+s.label+'".'});fail=true;}
    let dt=readDate(rest,s.fmt,false),sepIssue=false;
    if(!dt){dt=readDate(rest,s.fmt,true); if(dt)sepIssue=true;}
    if(!dt){
      const a0=swapDM(s.fmt),d0=a0?readDate(rest,a0,true):null;
      if(d0) lines.push({m:'no',t:'Nghi in nhầm thứ tự ngày/tháng',
        d:'"'+rest+'" không đọc được theo '+s.fmt+', nhưng đọc được thành '+fmtVN(d0)+' theo kiểu '+a0+
          '. Thị trường '+(it.thi_truong||'này')+' phải in '+s.fmt+'. Kiểm tra cấu hình máy in.'});
      else lines.push({m:'no',t:title,d:'"'+rest+'" không khớp tiêu chuẩn '+s.fmt+'. Kiểm tra số ký tự và thứ tự ngày/tháng/năm.'});
      fail=true;continue;}
    if(sepIssue){lines.push({m:'no',t:title,
      d:'Đọc được ngày '+fmtVN(dt)+' nhưng sai dấu phân cách hoặc khoảng trắng. Tiêu chuẩn: '+s.fmt});fail=true;}
    if(s.kind==='PROD'){
      const dd=dayDiff(dt,nsx);
      if(dd===0)lines.push({m:'ok',t:title,d:fmtVN(dt)+' — khớp ngày sản xuất theo lot.'});
      else{lines.push({m:'no',t:title,d:'In '+fmtVN(dt)+' nhưng lot sản xuất ngày '+fmtVN(nsx)+' (lệch '+dd+' ngày).'});fail=true;}
    } else if(s.kind==='EXPIRY'){
      if(isNaN(months)){lines.push({m:'wa',t:title,d:'Đọc được '+fmtVN(dt)+' nhưng master chưa có hạn sử dụng TCTP — không tính được.'});warn=true;}
      else{const exp=addMonths(nsx,months),dd=dayDiff(dt,exp);
        if(dd===0)lines.push({m:'ok',t:title,d:fmtVN(dt)+' — đúng NSX + '+months+' tháng.'});
        else if(Math.abs(dd)===1){lines.push({m:'wa',t:title,
          d:fmtVN(dt)+' lệch '+dd+' ngày so với NSX + '+months+' tháng ('+fmtVN(exp)+'). Xác nhận quy tắc trừ ngày của nhà máy.'});warn=true;}
        else{lines.push({m:'no',t:title,d:'In '+fmtVN(dt)+', đúng phải là '+fmtVN(exp)+' (NSX + '+months+' tháng). Lệch '+dd+' ngày.'});fail=true;}}
    } else lines.push({m:'ok',t:title,d:'Đọc được '+fmtVN(dt)+'.'});
    const alt=swapDM(s.fmt);
    if(alt){const adt=readDate(rest,alt,true);
      if(adt&&adt.getTime()!==dt.getTime()){
        let msg='Chuỗi này cũng đọc được thành '+fmtVN(adt)+' theo kiểu '+alt+'. ';
        if(s.kind==='EXPIRY'&&!isNaN(months)){
          const exp=addMonths(nsx,months);
          if(dayDiff(adt,exp)===0&&dayDiff(dt,exp)!==0){
            lines.push({m:'no',t:'Nghi in nhầm thứ tự ngày/tháng',
              d:msg+'Cách đọc thứ hai lại đúng hạn. Nhiều khả năng máy in đang set '+alt+' thay vì '+s.fmt+'. Dừng và kiểm tra máy in.'});
            fail=true;continue;}}
        lines.push({m:'wa',t:'Ngày có thể đọc hai cách',
          d:msg+'Thị trường '+(it.thi_truong||'này')+' dùng '+s.fmt+' — xác nhận đúng chiều trước khi chạy.'});warn=true;}}
  }
  return {lines,fail,warn};
}

/* Chỉ hiện mã có khai cho nhà máy đang chọn. Mã không khai cho site này
   mà vẫn kiểm được thì đó là lỗi master, không phải chuyện app tự nới ra. */
function hopSite(r){
  if(!r.site_ap_dung) return true;               // bảng đời cũ không có cột site
  return r.site_ap_dung.toUpperCase().indexOf(SITE_APP)>=0;
}
function render(){
  const q=$('q').value.trim().toUpperCase(), box=$('results');
  let head='', list=[];
  if(q.length<2){
    const rc=recents().map(c=>MASTER.find(r=>r.item_code===c)).filter(Boolean);
    if(!rc.length){ box.innerHTML='<div class="empty">Gõ 2 ký tự trở lên để tìm.<br>Các mã vừa kiểm sẽ hiện sẵn ở đây.</div>'; return; }
    head='Vừa kiểm gần đây'; list=rc;
  } else {
    head=''; list=MASTER.filter(hopSite).filter(r=>r.item_code.toUpperCase().includes(q)
      ||r.ten_san_pham.toUpperCase().includes(q)
      ||(r.tu_khoa||'').toUpperCase().includes(q)
      ||(r.thi_truong||'').toUpperCase()===q).slice(0,40);
    if(!list.length){
      const ngoai=MASTER.filter(r=>!hopSite(r)).filter(r=>r.item_code.toUpperCase().includes(q)
        ||r.ten_san_pham.toUpperCase().includes(q)||(r.tu_khoa||'').toUpperCase().includes(q));
      if(ngoai.length) head='Không có mã nào của '+SITE_APP+
        '. '+ngoai.length+' mã khớp nhưng khai cho nhà máy khác — kiểm lại master.';
    }

  box.innerHTML=(head?'<div class="listhead">'+head+'</div>':'')+
    (list.length?list.map(r=>`<div class="hit" tabindex="0" data-c="${r.item_code}">
      <div class="c">${r.item_code}${r.thi_truong?' · '+r.thi_truong:''}</div>

     :'<div class="empty">Không có item nào khớp.</div>');
}

function run(){
  const v=$('nsx').value;
  if(!v){alert('Chưa nhập ngày sản xuất theo lot.');return;}
  const who=$('who').value.trim();
  if(!who){alert('Nhập tên người kiểm ở đầu màn hình trước.');$('who').focus();return;}
  store.set('dc_user',who);

  const p=v.split('-'), nsx=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  const segs=segments(CUR), inputs={};
  segs.forEach(s=>inputs[s.i]=(($('in'+s.i)||{}).value||'').trim());

  const r=check(CUR,nsx,inputs);
  const noData=CUR.trang_thai!=='SAN_SANG';
  let cls,head,sub;
  if(noData){cls='v-warn';head='KHÔNG KẾT LUẬN ĐƯỢC';sub='Master thiếu dữ liệu — không được coi là đạt.';}
  else if(r.fail){cls='v-fail';head='KHÔNG ĐẠT';sub='Dừng, không chạy đơn. Báo QA.';}
  else if(r.warn){cls='v-warn';head='CẦN XÁC NHẬN';sub='Có điểm chưa chắc chắn — ghi rõ ai xác nhận và căn cứ gì.';}
  else{cls='v-pass';head='ĐẠT';sub='Khớp tiêu chuẩn in và đúng hạn theo TCTP.';}

  /* gửi kết quả cuối về sổ chung của trạm — để đo 2 cột chỉ số */
  if(TRAM_URL && LAST_OCR && LAST_OCR.id){
    const chuoi=segs.map(s=>inputs[s.i]).filter(x=>x).join(' | ');
    fetch(TRAM_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({act:'ketqua',id:LAST_OCR.id,chuoi_xac_nhan:chuoi,
        ket_luan:head,ly_do:sub,ngay_sx:v})}).catch(()=>{});
    LAST_OCR=null;
  }

  /* ghi sổ NGAY, trước khi hiện kết quả */
  LASTID='c'+Date.now();
  const rec={id:LASTID,thoi_gian:new Date().toLocaleString('vi-VN'),nguoi_kiem:who,
    item_code:CUR.item_code,ten_san_pham:CUR.ten_san_pham,thi_truong:CUR.thi_truong,
    ngay_sx:fmtVN(nsx),chuoi_in:segs.map(s=>inputs[s.i]).filter(Boolean).join(' / '),
    ket_luan:head,ly_do:r.lines.filter(l=>l.m!=='ok').map(l=>l.d).join(' | '),ghi_chu:'',
    nguon_master:$('dot').className.includes('ok')?'file':'nhúng'};
  const log=readLog(); log.push(rec); writeLog(log);
  pushRecent(CUR.item_code);

  $('verdict').innerHTML=`<div class="verdict ${cls}">
    <div class="head"><b>${head}</b><span>${sub}</span></div>
    <div class="body">${r.lines.map(l=>`<div class="line"><span class="m ${l.m}">${l.m==='ok'?'✓':l.m==='no'?'✕':'!'}</span>
      <span class="t"><b>${l.t}</b><span class="d">${l.d}</span></span></div>`).join('')}</div>
    <div class="saved">
      <div class="s">Đã ghi sổ lúc ${rec.thoi_gian} · ${who}</div>
      ${head!=='ĐẠT'?`<div class="field" style="margin-top:9px">
        <label>Ghi chú / người xác nhận</label>
        <input id="note" placeholder="VD: đã chỉnh máy in, chạy lại lô — anh X duyệt"></div>`:''}
      <div class="row2">
        ${head!=='ĐẠT'?`<button class="ghost" type="button" id="savenote">Lưu ghi chú</button>`:''}
        <button class="ghost" type="button" id="copy">Sao chép kết quả</button>
        <button class="ghost" type="button" id="again">Kiểm mã khác</button>
      </div>
    </div></div>`;

  const sn=$('savenote');
  if(sn) sn.onclick=()=>{
    const log=readLog(), i=log.findIndex(x=>x.id===LASTID);
    if(i>=0){log[i].ghi_chu=$('note').value.trim();writeLog(log);sn.textContent='Đã lưu ghi chú';}
  };
  $('copy').onclick=()=>{
    const t=[head,rec.item_code+' · '+rec.ten_san_pham,'NSX theo lot: '+rec.ngay_sx,
      'Chuỗi in: '+rec.chuoi_in,...r.lines.map(l=>(l.m==='ok'?'[OK] ':l.m==='no'?'[LỖI] ':'[!] ')+l.t+' — '+l.d),
      'Người kiểm: '+who+' · '+rec.thoi_gian].join('\n');
    navigator.clipboard?.writeText(t).then(()=>$('copy').textContent='Đã sao chép',
      ()=>alert(t));
  };
  $('again').onclick=()=>{CUR=null;$('item').innerHTML='';$('verdict').innerHTML='';
    $('q').focus();window.scrollTo({top:0,behavior:'smooth'});render();};

  $('verdict').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---- sổ kiểm ---- */
function paintLog(){
  const l=readLog().slice().reverse();
  const n=readLog().length, f=readLog().filter(r=>r.ket_luan==='KHÔNG ĐẠT').length;
  $('logsum').textContent = n? `${n} lượt kiểm · ${f} lượt KHÔNG ĐẠT` : 'Chưa có lượt kiểm nào trên máy này.';
  $('loglist').innerHTML = l.length? '<div class="log">'+l.map(r=>{
    const p=r.ket_luan==='ĐẠT'?'p-pass':r.ket_luan==='KHÔNG ĐẠT'?'p-fail':'p-warn';
    return `<div class="logrow"><span class="pill ${p}">${r.ket_luan}</span>
      <span class="b">${r.item_code} · ${r.thi_truong||''}
      <span class="s">${r.thoi_gian} · ${r.nguoi_kiem} · NSX ${r.ngay_sx} · in "${r.chuoi_in}"
      ${r.ghi_chu?'<br>Ghi chú: '+r.ghi_chu:''}</span></span></div>`;
  }).join('')+'</div>' : '';
}

/* ==================================================================
   KHỐI CAMERA — thêm vào bản gốc. Không đụng tới hàm check().
   Máy đọc chỉ ĐIỀN SẴN ô nhập. Kết luận vẫn do check() tính từ
   ngày sản xuất theo lot. Máy đọc sai không làm sai kết luận.
   ================================================================== */

/* TRAM_URL đã khai báo ở đầu file — KHÔNG khai báo lại ở đây.
   Khai báo bằng let ở cuối file sẽ ném ReferenceError cho mọi dòng dùng nó
   phía trên (vùng chết tạm thời), làm đứt cả phần khởi tạo. */

const CAM = {
  COLS: 40, ROWS: 30,
  NHAY: 78,
  MOI_GIAY: 8,        // chỉ dò 8 lần/giây, không dò mỗi khung hình
  LAM_MUOT: 0.25,     // hệ số trượt toạ độ khung
  CAN_LIEN: 3,        // phải thấy 3 lần liên tiếp mới vẽ khung
  GIU_KHUNG: 10       // mất dấu thì vẫn giữ khung thêm 10 vòng
};

let camStream=null, camSau=true, camSegs=[], camRAF=null;
let camLuoi=null, camLctx=null;
let camKhung=null, camDem=0, camMat=0, camNguongEMA=null, camLanCuoi=0, camCaoGoc=null;

function camKhoiDong(segs){
  camSegs=segs;
  camLuoi=document.createElement('canvas');
  camLuoi.width=CAM.COLS*8; camLuoi.height=CAM.ROWS*8;
  camLctx=camLuoi.getContext('2d',{willReadFrequently:true});
  camKhung=null; camDem=0; camMat=0; camNguongEMA=null;
  document.getElementById('camchup').onclick=camChup;
  document.getElementById('camdoi').onclick=()=>{camSau=!camSau;camMo();};
  camMo();
}

async function camMo(){
  if(camStream) camStream.getTracks().forEach(t=>t.stop());
  const v=document.getElementById('camv'); if(!v) return;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:camSau?'environment':'user',width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=camStream; await v.play();
    document.getElementById('camtt').textContent='đang quét';
    if(camRAF) cancelAnimationFrame(camRAF);
    camVong();
  }catch(e){
    document.getElementById('camtt').innerHTML=
      'Không mở được camera. Trang phải mở qua <b>https</b> — dùng đúng link github.io, '+
      'không mở file đã tải về.';
  }
}

/* ---- dò vùng: vùng sáng có nhiều đốm tối nhỏ ---- */
function camDoVung(){
  const v=document.getElementById('camv');
  camLctx.drawImage(v,0,0,camLuoi.width,camLuoi.height);
  const d=camLctx.getImageData(0,0,camLuoi.width,camLuoi.height).data;
  const W=camLuoi.width, cw=W/CAM.COLS, ch=camLuoi.height/CAM.ROWS;
  const sang=new Float32Array(CAM.ROWS*CAM.COLS), bien=new Float32Array(CAM.ROWS*CAM.COLS);
  for(let r=0;r<CAM.ROWS;r++)for(let c=0;c<CAM.COLS;c++){
    let tong=0,tb=0,n=0; const y0=(r*ch)|0,x0=(c*cw)|0;
    for(let y=y0;y<y0+ch;y++){ let tr=-1;
      for(let x=x0;x<x0+cw;x++){
        const i=(y*W+x)*4, g=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;
        tong+=g; n++; if(tr>=0) tb+=Math.abs(g-tr); tr=g; } }
    sang[r*CAM.COLS+c]=tong/n; bien[r*CAM.COLS+c]=tb/n;
  }
  /* ngưỡng trượt chậm qua các khung hình — đây là chỗ gây nhảy loạn xạ nếu
     tính lại độc lập từng khung */
  const sx=Array.from(bien).sort((a,b)=>a-b);
  const ng=sx[Math.floor(sx.length*(CAM.NHAY/100))];
  camNguongEMA = camNguongEMA===null ? ng : camNguongEMA*0.8 + ng*0.2;

  const o=new Uint8Array(CAM.ROWS*CAM.COLS);
  for(let i=0;i<o.length;i++) o[i]=(sang[i]>120&&bien[i]>camNguongEMA)?1:0;

  const tham=new Int32Array(CAM.ROWS*CAM.COLS).fill(-1), vung=[];
  for(let i=0;i<o.length;i++){
    if(!o[i]||tham[i]>=0) continue;
    const id=vung.length, hang=[i]; tham[i]=id;
    let x0=CAM.COLS,y0=CAM.ROWS,x1=0,y1=0,dem=0;
    while(hang.length){
      const p=hang.pop(), pr=(p/CAM.COLS)|0, pc=p%CAM.COLS; dem++;
      if(pc<x0)x0=pc; if(pc>x1)x1=pc; if(pr<y0)y0=pr; if(pr>y1)y1=pr;
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        const nr=pr+dr,nc=pc+dc;
        if(nr<0||nc<0||nr>=CAM.ROWS||nc>=CAM.COLS) continue;
        const q=nr*CAM.COLS+nc; if(o[q]&&tham[q]<0){tham[q]=id;hang.push(q);} } }
    vung.push({x0,y0,x1,y1,dem});
  }
  return vung.filter(z=>{const w=z.x1-z.x0+1,h=z.y1-z.y0+1;
    return z.dem>=4 && w/h>1.8 && w/h<16;});
}

/* ---- bám khung cũ thay vì luôn lấy vùng to nhất ---- */
function camChon(ds){
  if(!ds.length) return null;
  if(!camKhung) return ds.sort((a,b)=>b.dem-a.dem)[0];
  const cx=(camKhung.x0+camKhung.x1)/2, cy=(camKhung.y0+camKhung.y1)/2;
  let tot=null, diem=1e9;
  ds.forEach(z=>{
    const zx=(z.x0+z.x1)/2, zy=(z.y0+z.y1)/2;
    const kc=Math.hypot(zx-cx,zy-cy) - z.dem*0.05;   // gần khung cũ + đủ to
    if(kc<diem){diem=kc;tot=z;}
  });
  return tot;
}

function camVong(){
  camRAF=requestAnimationFrame(camVong);
  const v=document.getElementById('camv');
  if(!v||!camStream||!v.videoWidth) return;

  const t=performance.now();
  if(t-camLanCuoi < 1000/CAM.MOI_GIAY) { camVe(); return; }
  camLanCuoi=t;

  const moi=camChon(camDoVung());
  if(moi){
    camMat=0; camDem++;
    if(!camKhung) camKhung={x0:moi.x0,y0:moi.y0,x1:moi.x1,y1:moi.y1};
    else{
      const a=CAM.LAM_MUOT;
      camKhung.x0+=(moi.x0-camKhung.x0)*a; camKhung.y0+=(moi.y0-camKhung.y0)*a;
      camKhung.x1+=(moi.x1-camKhung.x1)*a; camKhung.y1+=(moi.y1-camKhung.y1)*a;
    }
  }else{
    camMat++; camDem=0;
    if(camMat>CAM.GIU_KHUNG) camKhung=null;
  }
  camVe();
  const tt=document.getElementById('camtt');
  if(tt) tt.textContent = (camKhung&&camDem>=CAM.CAN_LIEN)
    ? 'thấy vùng ngày — bấm Chụp và đọc'
    : 'đưa máy lại gần ô in ngày';
}

function camVe(){
  const v=document.getElementById('camv'), ve=document.getElementById('camve');
  if(!v||!ve) return;
  if(ve.width!==v.clientWidth){ve.width=v.clientWidth;ve.height=v.clientHeight;}
  const ctx=ve.getContext('2d');
  ctx.clearRect(0,0,ve.width,ve.height);
  if(!camKhung||camDem<CAM.CAN_LIEN) return;
  const sx=ve.width/CAM.COLS, sy=ve.height/CAM.ROWS;
  const x=camKhung.x0*sx, y=camKhung.y0*sy;
  const w=(camKhung.x1-camKhung.x0+1)*sx, h=(camKhung.y1-camKhung.y0+1)*sy;
  ctx.strokeStyle='#4ADE9B'; ctx.lineWidth=3; ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='rgba(74,222,155,.10)'; ctx.fillRect(x,y,w,h);
}

/* ---- chụp: cắt từ ảnh GỐC, chỉ phóng to ---- */
function camCat(){
  const v=document.getElementById('camv');
  const c=document.createElement('canvas');
  c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  if(!camKhung||camDem<CAM.CAN_LIEN) return {canvas:c,cao:null};

  const pad=0.25;
  const w=(camKhung.x1-camKhung.x0+1)/CAM.COLS, h=(camKhung.y1-camKhung.y0+1)/CAM.ROWS;
  const px=w*pad*.5, py=h*pad;
  const x0=Math.max(0,(camKhung.x0/CAM.COLS-px))*c.width;
  const y0=Math.max(0,(camKhung.y0/CAM.ROWS-py))*c.height;
  const x1=Math.min(1,(camKhung.x1+1)/CAM.COLS+px)*c.width;
  const y1=Math.min(1,(camKhung.y1+1)/CAM.ROWS+py)*c.height;
  const cw=Math.round(x1-x0), chh=Math.round(y1-y0);
  const he=Math.min(4,Math.max(1,Math.round(240/Math.max(1,chh))));
  const cc=document.createElement('canvas');
  cc.width=cw*he; cc.height=chh*he;
  const g=cc.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  g.drawImage(c,x0,y0,cw,chh,0,0,cc.width,cc.height);
  return {canvas:cc,cao:chh};
}

async function camChup(){
  const nut=document.getElementById('camchup'), tt=document.getElementById('camtt');
  const hop=document.getElementById('camdoc');
  const a=camCat();
  nut.disabled=true; tt.textContent='đang gửi ảnh…';
  camCaoGoc=a.cao;
  try{
    const r=await fetch(TRAM_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({act:'doc',
        anh_b64:a.canvas.toDataURL('image/jpeg',.92).split(',')[1],
        ma_item:(CUR&&CUR.item_code)||'', cao_vung_px:a.cao,
        nguoi_kiem:($('who').value||'').trim()})}).then(x=>x.json());

    if(!r||!r.ok) throw new Error((r&&r.loi)||'trạm không trả lời');
    LAST_OCR = { id:r.id, dong:r.dong||[] };
    hop.style.display='block';
    hop.textContent='Máy đọc được:\n'+(r.dong||[]).join('\n')+
      '\n\nĐã điền vào ô bên dưới. Đối chiếu với bao bì, sai thì sửa.';
    camDienVaoO(r.dong||[]);
    tt.textContent='đọc xong — kiểm lại rồi bấm Kiểm tra';
  }catch(e){
    hop.style.display='block';
    hop.textContent='Không đọc được: '+e.message+'\nGõ tay vào ô bên dưới như bình thường.';
    tt.textContent='đang quét';
  }
  nut.disabled=false;
}

let LAST_OCR=null;

/* Điền dòng OCR vào đúng ô theo NHÃN mà master khai — không đoán theo thứ tự. */
function camDienVaoO(dong){
  const chuan=t=>String(t).toUpperCase().replace(/\s+/g,'');
  camSegs.forEach(s=>{
    const o=$('in'+s.i); if(!o||!s.label) return;
    const nh=chuan(s.label);
    const hit=dong.find(d=>chuan(d).startsWith(nh));
    if(hit) o.value=String(hit).trim();
  });
}

</script>
